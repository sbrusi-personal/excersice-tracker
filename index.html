// BACKEND / STORAGE HELPERS
// ─────────────────────────────────────────────────────────────────
function getBackendUrl() {
  const stored = loadLocal().backendUrl;
  return (stored && stored.includes('script.google.com')) ? stored : BACKEND;
}
function api(params) {
  const url = getBackendUrl();
  if (!url || !url.includes('script.google.com')) return Promise.resolve(null);
  return new Promise((resolve) => {
    const cb = 'cb_' + Math.random().toString(36).slice(2);
    const qs = Object.entries({...params, callback:cb}).map(([k,v])=>`${encodeURIComponent(k)}=${encodeURIComponent(String(v))}`).join('&');
    const s = document.createElement('script');
    const t = setTimeout(()=>{delete window[cb];s.remove();resolve(null);},12000);
    window[cb]=(d)=>{clearTimeout(t);delete window[cb];s.remove();resolve(d);};
    s.onerror=()=>{clearTimeout(t);delete window[cb];s.remove();resolve(null);};
    s.src=`${url}?${qs}`; document.head.appendChild(s);
  });
}
function loadLocal() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY))||{}; } catch(e){return{};} }
function saveLocal(data) { try { localStorage.setItem(STORAGE_KEY,JSON.stringify(data)); } catch(e){} }
function loadWeightLog() { try { return JSON.parse(localStorage.getItem(WEIGHT_KEY))||[]; } catch(e){return[];} }
function saveWeightLog(log) { try { localStorage.setItem(WEIGHT_KEY,JSON.stringify(log)); } catch(e){} }

// DATE HELPERS
// ─────────────────────────────────────────────────────────────────
function normalizeDate(d) { if(!d) return d; return String(d).slice(0,10); }
function todayStr() { const n=new Date(); return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`; }
function daysBetween(d1,d2) { return Math.round((new Date(normalizeDate(d2)+'T12:00:00')-new Date(normalizeDate(d1)+'T12:00:00'))/86400000); }
function todayDayOfWeek() { return new Date().getDay(); }
function formatTime(sec) { const m=Math.floor(sec/60),s=sec%60; return m>0?`${m}m ${s}s`:`${s}s`; }
function getDayLabel(dateStr) {
  const days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const d=new Date(normalizeDate(dateStr)+'T12:00:00');
  return `${days[d.getDay()]} ${months[d.getMonth()]} ${d.getDate()}`;
}

function makeLogState(plan, existingSession, customDefaults) {
  if (plan.type==='strength') {
    let existing=null;
    if (existingSession?.exercises_json) { try { existing=JSON.parse(existingSession.exercises_json); } catch(e){} }
    return {
      exercises: plan.exercises.map((ex,i)=>{
        if (existing&&existing[i]) return existing[i];
        const custom=(customDefaults&&customDefaults[ex.name])||{};
        const sets=[];
        for (let s=0;s<ex.sets;s++) {
          if (ex.isPlank) sets.push({time:0,done:false});
          else sets.push({reps:custom.reps??ex.reps, weight:ex.bodyweight?0:(custom.weight??ex.defaultWeight??15), done:false});
        }
        return {name:ex.name,type:ex.isPlank?'plank':'strength',bodyweight:!!ex.bodyweight,perSide:!!ex.perSide,sets};
      }),
      duration: existingSession?.duration_min||'',
      notes: existingSession?.notes||'',
    };
  } else {
    return { duration:existingSession?.duration_min||(plan.duration?String(plan.duration):''), notes:existingSession?.notes||'' };
  }
}

function getActivePlan(dow, settings, overrideKey) {
  let template=null,overrides=null;
  try { template=settings?.weekTemplate?JSON.parse(settings.weekTemplate):null; } catch(e){}
  try { overrides=settings?.exerciseOverrides?JSON.parse(settings.exerciseOverrides):null; } catch(e){}
  const typeKey = overrideKey || (template&&template[String(dow)]) || DEFAULT_WEEK[String(dow)];
  const dayConfig=DAY_TYPES[typeKey]||DAY_TYPES.rest;
  if (dayConfig.type==='strength') {
    const exercises=(overrides&&overrides[typeKey])||dayConfig.defaultExercises;
    return {...dayConfig,exercises,typeKey};
  }
  return {...dayConfig,typeKey};
}

function OnboardingScreen({onComplete}) {
  const [mode,setMode]=React.useState('choice');
  const [url,setUrl]=React.useState('');
  const [status,setStatus]=React.useState('');
  async function handleRestore() {
    if (!url.includes('script.google.com')) { setStatus('Paste the full /exec URL'); return; }
    setStatus('Connecting...');
    saveLocal({backendUrl:url});
    const res=await api({action:'get_all'});
    if (!res?.ok) { setStatus('Could not reach that URL — check deployment settings.'); return; }
    onComplete(url,res);
  }
  const page={minHeight:'100vh',background:'#05080f',color:'#cbd5e1',fontFamily:'Georgia,serif',display:'flex',alignItems:'center',justifyContent:'center',padding:24};
  const bigBtn=(col)=>({display:'block',width:'100%',padding:'15px',fontFamily:'Georgia,serif',fontSize:16,background:col==='blue'?'#1e3a5f':'#1c2a1c',border:`1px solid ${col==='blue'?'#3b82f6':'#166534'}`,borderRadius:10,color:col==='blue'?'#93c5fd':'#4ade80',cursor:'pointer',marginBottom:12});
  return (
    <div style={page}>
      {mode==='choice' ? (
        <div style={{textAlign:'center',maxWidth:340,width:'100%'}}>
          <div style={{fontSize:48,marginBottom:12}}>🏋️</div>
          <div style={{fontSize:22,fontWeight:700,color:'#f1f5f9',marginBottom:6}}>Workout Tracker</div>
          <div style={{color:'#64748b',fontSize:14,marginBottom:32}}>Home training log · Wegovy plan</div>
          <button onClick={()=>onComplete(BACKEND,null)} style={bigBtn('blue')}>Start fresh</button>
          <button onClick={()=>setMode('restore')} style={bigBtn('green')}>Restore from cloud (other device)</button>
        </div>
      ) : (
        <div style={{maxWidth:360,width:'100%'}}>
          <div style={{fontSize:16,fontWeight:700,color:'#f1f5f9',marginBottom:8}}>Paste your Apps Script URL</div>
          <input value={url} onChange={e=>setUrl(e.target.value)} placeholder="https://script.google.com/macros/s/.../exec"
            style={{width:'100%',padding:'10px 12px',background:'#0f172a',border:'1px solid #1e3a5f',borderRadius:8,color:'#f1f5f9',fontSize:12,marginBottom:12}}/>
          {status&&<div style={{fontSize:13,marginBottom:8,color:status.startsWith('Could')?'#ef4444':'#94a3b8'}}>{status}</div>}
          <button onClick={handleRestore} style={bigBtn('blue')}>Connect & Restore</button>
          <button onClick={()=>setMode('choice')} style={{width:'100%',padding:'10px',background:'none',border:'1px solid #1e293b',borderRadius:8,color:'#475569',fontSize:14,cursor:'pointer',fontFamily:'Georgia,serif'}}>Back</button>
        </div>
      )}
    </div>
  );
}

// ─────────────────────────────────────────────────────────────────
// PLANK TIMER
// ─────────────────────────────────────────────────────────────────
function PlankTimer({onDone}) {
  const [running,setRunning]=React.useState(false);
  const [elapsed,setElapsed]=React.useState(0);
  const startRef=React.useRef(null);
  const timerRef=React.useRef(null);
  function start() { startRef.current=Date.now()-elapsed*1000; setRunning(true); timerRef.current=setInterval(()=>setElapsed(Math.floor((Date.now()-startRef.current)/1000)),100); }
  function pause() { clearInterval(timerRef.current); setRunning(false); }
  function finish() { clearInterval(timerRef.current); setRunning(false); onDone(elapsed); }
  React.useEffect(()=>()=>clearInterval(timerRef.current),[]);
  return (
    <div style={{background:'#060c18',border:'1px solid #1e3a5f',borderRadius:10,padding:14,marginTop:8}}>
      <div style={{fontSize:36,fontWeight:700,color:'#22d3ee',textAlign:'center',marginBottom:12,letterSpacing:2}}>{formatTime(elapsed)}</div>
      <div style={{display:'flex',gap:8}}>
        {!running ? (
          <button onClick={start} style={{flex:1,padding:'12px',background:'#1e3a5f',border:'1px solid #3b82f6',borderRadius:8,color:'#93c5fd',cursor:'pointer',fontFamily:'Georgia,serif',fontSize:15}}>
            {elapsed>0?'▶ Resume':'▶ Start'}
          </button>
        ) : (
          <button onClick={pause} style={{flex:1,padding:'12px',background:'#2d1f00',border:'1px solid #f97316',borderRadius:8,color:'#fdba74',cursor:'pointer',fontFamily:'Georgia,serif',fontSize:15}}>⏸ Pause</button>
        )}
        {elapsed>0&&<button onClick={finish} style={{flex:1,padding:'12px',background:'#1c2a1c',border:'1px solid #166534',borderRadius:8,color:'#4ade80',cursor:'pointer',fontFamily:'Georgia,serif',fontSize:15}}>✓ Done</button>}
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────────
// TODAY TAB  (with quick-swap)
// ─────────────────────────────────────────────────────────────────
function TodayTab({sessions,onSave,settings}) {
  const today=todayStr();
  const dow=todayDayOfWeek();

  // Today override — stored in localStorage keyed to today's date
  const [overrideKey,setOverrideKey]=React.useState(()=>{
    try { const s=JSON.parse(localStorage.getItem(OVERRIDE_KEY)); return (s&&s.date===today)?s.typeKey:null; } catch(e){return null;}
  });
  const [showSwap,setShowSwap]=React.useState(false);

  const plan=React.useMemo(()=>getActivePlan(dow,settings,overrideKey),[dow,settings,overrideKey]);

  const existingSession=sessions.find(s=>normalizeDate(s.date)===today);
  const isDone=existingSession?.done==='true'||existingSession?.done===true;

  const customDefaults=React.useMemo(()=>{
    try { return settings?.customDefaults?JSON.parse(settings.customDefaults):{}; } catch(e){return{};}
  },[settings?.customDefaults]);

  const [logState,setLogState]=React.useState(()=>makeLogState(plan,existingSession,customDefaults));
  const [saved,setSaved]=React.useState(isDone);
  const [openTimerKey,setOpenTimerKey]=React.useState(null);

  // Reset logState when plan type changes (due to override)
  const prevTypeKey=React.useRef(plan.typeKey);
  React.useEffect(()=>{
    if (plan.typeKey!==prevTypeKey.current) {
      prevTypeKey.current=plan.typeKey;
      setLogState(makeLogState(plan,null,customDefaults));
      setSaved(false);
    }
  },[plan.typeKey]);

  const startDate=settings?.startDate;
  const weeksIn=startDate?Math.floor(daysBetween(startDate,today)/7)+1:null;
  const showProgressionBanner=weeksIn&&weeksIn>=2&&weeksIn%2===0;
  const dayNames=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const DOW_NAMES=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const scheduledKey=(()=>{try{const t=settings?.weekTemplate?JSON.parse(settings.weekTemplate):null;return(t&&t[String(dow)])||DEFAULT_WEEK[String(dow)];}catch(e){return DEFAULT_WEEK[String(dow)];}})();

  function applyOverride(typeKey) {
    localStorage.setItem(OVERRIDE_KEY,JSON.stringify({date:today,typeKey}));
    setOverrideKey(typeKey);
    setShowSwap(false);
  }
  function clearOverride() {
    localStorage.removeItem(OVERRIDE_KEY);
    setOverrideKey(null);
    setShowSwap(false);
  }

  function updateSetField(exIdx,setIdx,field,value) {
    setLogState(prev=>({...prev,exercises:prev.exercises.map((ex,ei)=>ei!==exIdx?ex:{...ex,sets:ex.sets.map((set,si)=>si!==setIdx?set:{...set,[field]:value})})}));
  }
  function setWeightAllSets(exIdx,weight) {
    setLogState(prev=>({...prev,exercises:prev.exercises.map((ex,ei)=>ei!==exIdx?ex:{...ex,sets:ex.sets.map(set=>({...set,weight}))})}));
  }
  function toggleSetDone(exIdx,setIdx) {
    setLogState(prev=>({...prev,exercises:prev.exercises.map((ex,ei)=>ei!==exIdx?ex:{...ex,sets:ex.sets.map((set,si)=>si!==setIdx?set:{...set,done:!set.done})})}));
  }
  function handlePlankDone(exIdx,setIdx,time) {
    setLogState(prev=>({...prev,exercises:prev.exercises.map((ex,ei)=>ei!==exIdx?ex:{...ex,sets:ex.sets.map((set,si)=>si!==setIdx?set:{...set,time,done:true})})}));
    setOpenTimerKey(null);
  }
  function addSet(exIdx) {
    setLogState(prev=>({...prev,exercises:prev.exercises.map((ex,ei)=>{
      if (ei!==exIdx) return ex;
      const last=ex.sets[ex.sets.length-1];
      const newSet=ex.type==='plank'?{time:0,done:false}:{reps:last?.reps??10,weight:last?.weight??15,done:false};
      return {...ex,sets:[...ex.sets,newSet]};
    })}));
  }
  function removeSet(exIdx) {
    setLogState(prev=>({...prev,exercises:prev.exercises.map((ex,ei)=>{
      if (ei!==exIdx||ex.sets.length<=1) return ex;
      return {...ex,sets:ex.sets.slice(0,-1)};
    })}));
  }
  function addExerciseOnTheFly(ex) {
    if (plan.type!=='strength') return;
    const newEx={name:ex.name,type:ex.isPlank?'plank':'strength',bodyweight:!!ex.bodyweight,perSide:!!ex.perSide,
      sets:Array.from({length:ex.sets||3},()=>ex.isPlank?{time:0,done:false}:{reps:ex.reps??10,weight:ex.bodyweight?0:(ex.defaultWeight??15),done:false})};
    setLogState(prev=>({...prev,exercises:[...prev.exercises,newEx]}));
    setShowAddEx(false);
  }
  const [showAddEx,setShowAddEx]=React.useState(false);
  const [addExSearch,setAddExSearch]=React.useState('');

  function handleSave(done) {
    const id=existingSession?.id||(Date.now()+'-'+Math.random().toString(36).slice(2,7));
    const session={id,date:today,day_type:`${plan.emoji} ${plan.name}`,
      exercises_json:plan.type==='strength'?JSON.stringify(logState.exercises):'[]',
      duration_min:logState.duration||'',notes:logState.notes||'',done:done?'true':'false'};
    onSave(session);
    if (done) setSaved(true);
  }

  const card={background:'#0f172a',border:'1px solid #1e293b',borderRadius:12,padding:14,marginBottom:12};
  const label={fontSize:12,color:'#64748b',marginBottom:4};
  const numInput={padding:'8px',background:'#0a0f1a',border:'1px solid #1e3a5f',borderRadius:6,color:'#f1f5f9',fontSize:16,textAlign:'center',width:'100%'};
  const finishBtn={width:'100%',padding:'16px',background:'#1e3a5f',border:'1px solid #3b82f6',borderRadius:10,color:'#93c5fd',cursor:'pointer',fontFamily:'Georgia,serif',fontSize:17,marginBottom:8};

  // Day header with swap button (shown on all non-saved states)
  function DayHeader() {
    return (
      <div style={{background:'#0a0f1a',border:'1px solid #1e293b',borderRadius:10,padding:'10px 14px',marginBottom:12,display:'flex',alignItems:'center',gap:12}}>
        <span style={{fontSize:26}}>{plan.emoji}</span>
        <div style={{flex:1}}>
          <div style={{color:'#f1f5f9',fontWeight:700,fontSize:16}}>{plan.name}</div>
          <div style={{color:'#64748b',fontSize:12}}>{dayNames[dow]}{overrideKey&&overrideKey!==scheduledKey&&<span style={{color:'#f97316'}}> · custom</span>}</div>
        </div>
        <button onClick={()=>setShowSwap(true)}
          style={{padding:'7px 12px',background:'none',border:'1px solid #1e3a5f',borderRadius:8,color:'#93c5fd',cursor:'pointer',fontSize:12,fontFamily:'Georgia,serif',flexShrink:0}}>
          ⇄ Change
        </button>
      </div>
    );
  }

  // ── Completed view ──
  if (saved&&existingSession) {
    let exercises=[];
    try { exercises=JSON.parse(existingSession.exercises_json||'[]'); } catch(e){}
    const wasSkipped=existingSession.day_type?.toLowerCase().includes('skip');
    return (
      <div style={{padding:'16px 16px 90px'}}>
        {showProgressionBanner&&<div style={{background:'#0f2a0f',border:'1px solid #166534',borderRadius:10,padding:12,marginBottom:12}}><div style={{color:'#4ade80',fontWeight:700,marginBottom:2}}>🎯 Progression Week!</div><div style={{color:'#86efac',fontSize:13}}>You're on week {weeksIn}. Time to add 5 lbs to each dumbbell exercise (or 1 extra rep)!</div></div>}
        <div style={{...card,border:`1px solid ${wasSkipped?'#2d3a00':'#166534'}`,textAlign:'center',padding:20}}>
          <div style={{fontSize:40,marginBottom:6}}>{wasSkipped?'😴':plan.emoji}</div>
          <div style={{color:wasSkipped?'#a3e635':'#4ade80',fontWeight:700,fontSize:20}}>{wasSkipped?'Rest day taken':`✓ ${plan.name} Complete!`}</div>
          <div style={{color:'#475569',fontSize:13,marginTop:4}}>{dayNames[dow]}</div>
          {!wasSkipped&&existingSession.duration_min&&<div style={{color:'#64748b',fontSize:13,marginTop:4}}>Duration: {existingSession.duration_min} min</div>}
        </div>
        {exercises.length>0&&<div style={card}>{exercises.map((ex,i)=>(
          <div key={i} style={{marginBottom:i<exercises.length-1?12:0}}>
            <div style={{color:'#94a3b8',fontWeight:700,fontSize:14,marginBottom:6}}>{ex.name}{ex.perSide&&<span style={{color:'#475569',fontSize:11,fontWeight:400}}> · each side</span>}</div>
            {ex.sets.map((set,j)=>(
              <div key={j} style={{display:'flex',gap:8,marginBottom:4,alignItems:'center'}}>
                <span style={{color:'#475569',fontSize:12,minWidth:44}}>Set {j+1}</span>
                {ex.type==='plank'?<span style={{color:'#22d3ee',fontSize:14}}>{set.done?formatTime(set.time):'—'}</span>
                  :<span style={{color:set.done?'#f1f5f9':'#475569',fontSize:14}}>{ex.bodyweight?'':`${set.weight} lbs × `}{set.reps} reps{set.done?' ✓':''}</span>}
              </div>
            ))}
            {i<exercises.length-1&&<div style={{borderBottom:'1px solid #1e293b',margin:'10px 0'}}/>}
          </div>
        ))}</div>}
        {existingSession.notes&&<div style={{color:'#64748b',fontSize:13,fontStyle:'italic',marginBottom:12,padding:'0 4px'}}>"{existingSession.notes}"</div>}
        <button onClick={()=>setSaved(false)} style={{width:'100%',padding:'12px',background:'none',border:'1px solid #1e293b',borderRadius:8,color:'#475569',cursor:'pointer',fontFamily:'Georgia,serif',fontSize:14}}>Edit Workout</button>
      </div>
    );
  }

  // ── Rest day ──
  if (plan.type==='rest') return (
    <div style={{padding:'16px 16px 90px'}}>
      <DayHeader/>
      <div style={{...card,textAlign:'center',padding:28}}>
        <div style={{fontSize:48,marginBottom:10}}>{plan.emoji}</div>
        <div style={{color:'#f1f5f9',fontWeight:700,fontSize:20,marginBottom:10}}>{plan.name}</div>
        {plan.tip&&<div style={{color:'#64748b',fontSize:14,lineHeight:1.6}}>{plan.tip}</div>}
      </div>
      <button onClick={()=>handleSave(true)} style={finishBtn}>Mark Complete ✓</button>
      {showSwap&&<SwapSheet plan={plan} scheduledKey={scheduledKey} overrideKey={overrideKey} onPick={applyOverride} onClear={clearOverride} onClose={()=>setShowSwap(false)}/>}
    </div>
  );

  // ── Cardio day ──
  if (plan.type==='cardio') return (
    <div style={{padding:'16px 16px 90px'}}>
      <DayHeader/>
      <div style={{...card,textAlign:'center',padding:24}}>
        <div style={{fontSize:44,marginBottom:8}}>{plan.emoji}</div>
        <div style={{color:'#f1f5f9',fontWeight:700,fontSize:20}}>{plan.name}</div>
        <div style={{color:'#475569',fontSize:13,marginTop:4}}>Target: {plan.duration} min</div>
        {plan.tip&&<div style={{color:'#64748b',fontSize:13,marginTop:8,lineHeight:1.5}}>{plan.tip}</div>}
      </div>
      <div style={card}>
        <div style={label}>Actual Duration (minutes)</div>
        <input type="number" value={logState.duration} onChange={e=>setLogState(prev=>({...prev,duration:e.target.value}))} style={numInput} placeholder={String(plan.duration)}/>
      </div>
      <div style={card}>
        <div style={label}>Notes (optional)</div>
        <textarea value={logState.notes} onChange={e=>setLogState(prev=>({...prev,notes:e.target.value}))} placeholder="How did it feel?" style={{width:'100%',padding:'8px',background:'#0a0f1a',border:'1px solid #1e293b',borderRadius:6,color:'#f1f5f9',fontSize:14,minHeight:64,fontFamily:'Georgia,serif'}}/>
      </div>
      <button onClick={()=>handleSave(true)} style={finishBtn}>Finish Workout ✓</button>
      <button onClick={()=>{if(!window.confirm('Mark today as a rest day instead?'))return;const id=existingSession?.id||(Date.now()+'-'+Math.random().toString(36).slice(2,7));onSave({id,date:today,day_type:`${plan.emoji} ${plan.name} (skipped)`,exercises_json:'[]',duration_min:'',notes:'',done:'true'});setSaved(true);}} style={{width:'100%',padding:'11px',background:'none',border:'1px solid #2d1500',borderRadius:8,color:'#9a4800',cursor:'pointer',fontFamily:'Georgia,serif',fontSize:13,marginTop:6}}>😴 Take a rest day instead</button>
      {showSwap&&<SwapSheet plan={plan} scheduledKey={scheduledKey} overrideKey={overrideKey} onPick={applyOverride} onClear={clearOverride} onClose={()=>setShowSwap(false)}/>}
    </div>
  );

  // ── Strength day ──
  const filteredPool=addExSearch.trim()?EXERCISE_POOL.filter(e=>e.name.toLowerCase().includes(addExSearch.toLowerCase())):EXERCISE_POOL;
  const alreadyNames=new Set(logState.exercises.map(e=>e.name));

  return (
    <div style={{padding:'16px 16px 100px'}}>
      {showProgressionBanner&&<div style={{background:'#0f2a0f',border:'1px solid #166534',borderRadius:10,padding:12,marginBottom:12}}><div style={{color:'#4ade80',fontWeight:700,marginBottom:2}}>🎯 Progression Week!</div><div style={{color:'#86efac',fontSize:13}}>Week {weeksIn}: Add 5 lbs to each exercise (or 1 extra rep).</div></div>}
      <DayHeader/>

      {logState.exercises.map((ex,exIdx)=>(
        <div key={exIdx} style={card}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
            <div style={{color:'#f1f5f9',fontWeight:700,fontSize:15}}>{ex.name}</div>
            <div style={{display:'flex',gap:6,alignItems:'center'}}>
              {ex.perSide&&<span style={{fontSize:11,color:'#64748b',background:'#1e293b',padding:'2px 8px',borderRadius:10}}>each side</span>}
            </div>
          </div>

          {ex.type==='plank'&&<div>
            {ex.sets.map((set,setIdx)=>{
              const timerKey=`${exIdx}-${setIdx}`;
              return (<div key={setIdx} style={{marginBottom:8}}>
                <div style={{display:'flex',alignItems:'center',gap:10}}>
                  <span style={{color:'#64748b',fontSize:13,minWidth:44}}>Set {setIdx+1}</span>
                  {set.done?(<><span style={{color:'#22d3ee',fontSize:15,flex:1}}>✓ {formatTime(set.time)}</span><button onClick={()=>{updateSetField(exIdx,setIdx,'done',false);updateSetField(exIdx,setIdx,'time',0);}} style={{padding:'5px 10px',background:'none',border:'1px solid #1e293b',borderRadius:6,color:'#475569',cursor:'pointer',fontSize:12}}>undo</button></>)
                  :(<button onClick={()=>setOpenTimerKey(openTimerKey===timerKey?null:timerKey)} style={{flex:1,padding:'9px',background:openTimerKey===timerKey?'#1a1a2e':'#0a0f1a',border:`1px solid ${openTimerKey===timerKey?'#3b82f6':'#1e3a5f'}`,borderRadius:6,color:'#93c5fd',cursor:'pointer',fontFamily:'Georgia,serif',fontSize:13}}>{openTimerKey===timerKey?'▲ Close Timer':'⏱ Open Timer'}</button>)}
                </div>
                {openTimerKey===timerKey&&<PlankTimer onDone={(t)=>handlePlankDone(exIdx,setIdx,t)}/>}
              </div>);
            })}
          </div>}

          {ex.type==='strength'&&<div>
            {!ex.bodyweight&&<div style={{display:'flex',alignItems:'center',gap:10,marginBottom:10}}>
              <span style={{color:'#64748b',fontSize:13,minWidth:44}}>Weight</span>
              <div style={{flex:1,position:'relative'}}>
                <input type="number" value={ex.sets[0]?.weight??0} onChange={e=>setWeightAllSets(exIdx,Number(e.target.value))} style={{...numInput,paddingRight:36}}/>
                <span style={{position:'absolute',right:10,top:'50%',transform:'translateY(-50%)',color:'#475569',fontSize:12,pointerEvents:'none'}}>lbs</span>
              </div>
            </div>}
            {ex.bodyweight&&<div style={{color:'#475569',fontSize:12,marginBottom:10}}>Bodyweight</div>}
            {ex.sets.map((set,setIdx)=>(
              <div key={setIdx} style={{display:'flex',alignItems:'center',gap:8,marginBottom:8}}>
                <span style={{color:'#64748b',fontSize:13,minWidth:44}}>Set {setIdx+1}</span>
                <input type="number" value={set.reps} onChange={e=>updateSetField(exIdx,setIdx,'reps',Number(e.target.value))} style={{width:58,padding:'8px',background:'#0a0f1a',border:`1px solid ${set.done?'#166534':'#1e3a5f'}`,borderRadius:6,color:'#f1f5f9',fontSize:16,textAlign:'center'}}/>
                <span style={{color:'#475569',fontSize:12}}>reps</span>
                <div style={{flex:1}}/>
                <button onClick={()=>toggleSetDone(exIdx,setIdx)} style={{width:44,height:44,background:set.done?'#1c2a1c':'#0f172a',border:`1px solid ${set.done?'#166534':'#1e293b'}`,borderRadius:8,color:set.done?'#4ade80':'#475569',cursor:'pointer',fontSize:20,display:'flex',alignItems:'center',justifyContent:'center'}}>{set.done?'✓':'○'}</button>
              </div>
            ))}
          </div>}

          {/* Add / remove set buttons */}
          <div style={{display:'flex',gap:8,marginTop:6}}>
            <button onClick={()=>removeSet(exIdx)} disabled={ex.sets.length<=1} style={{flex:1,padding:'6px',background:'none',border:'1px solid #1e293b',borderRadius:6,color:ex.sets.length<=1?'#1e293b':'#64748b',cursor:'pointer',fontSize:12,fontFamily:'Georgia,serif'}}>− set</button>
            <button onClick={()=>addSet(exIdx)} style={{flex:1,padding:'6px',background:'none',border:'1px solid #1e3a5f',borderRadius:6,color:'#93c5fd',cursor:'pointer',fontSize:12,fontFamily:'Georgia,serif'}}>+ set</button>
          </div>
        </div>
      ))}

      {/* Add exercise on the fly */}
      <button onClick={()=>{setShowAddEx(true);setAddExSearch('');}} style={{width:'100%',padding:'11px',background:'none',border:'1px dashed #1e3a5f',borderRadius:10,color:'#475569',cursor:'pointer',fontFamily:'Georgia,serif',fontSize:13,marginBottom:12}}>+ Add exercise to today's workout</button>

      <div style={card}>
        <div style={label}>Total Duration (min, optional)</div>
        <input type="number" value={logState.duration} onChange={e=>setLogState(prev=>({...prev,duration:e.target.value}))} style={numInput} placeholder="e.g. 35"/>
      </div>
      <div style={card}>
        <div style={label}>Notes (optional)</div>
        <textarea value={logState.notes} onChange={e=>setLogState(prev=>({...prev,notes:e.target.value}))} placeholder="How did it feel?" style={{width:'100%',padding:'8px',background:'#0a0f1a',border:'1px solid #1e293b',borderRadius:6,color:'#f1f5f9',fontSize:14,minHeight:60,fontFamily:'Georgia,serif'}}/>
      </div>

      <button onClick={()=>handleSave(true)} style={finishBtn}>Finish Workout ✓</button>
      <button onClick={()=>handleSave(false)} style={{width:'100%',padding:'11px',background:'none',border:'1px solid #1e293b',borderRadius:8,color:'#475569',cursor:'pointer',fontFamily:'Georgia,serif',fontSize:13}}>Save Progress (come back later)</button>
      <button onClick={()=>{if(!window.confirm('Mark today as a rest day instead?'))return;const id=existingSession?.id||(Date.now()+'-'+Math.random().toString(36).slice(2,7));onSave({id,date:today,day_type:`${plan.emoji} ${plan.name} (skipped)`,exercises_json:'[]',duration_min:'',notes:'',done:'true'});setSaved(true);}} style={{width:'100%',padding:'11px',background:'none',border:'1px solid #2d1500',borderRadius:8,color:'#9a4800',cursor:'pointer',fontFamily:'Georgia,serif',fontSize:13,marginTop:4}}>😴 Take a rest day instead</button>

      {/* Quick swap sheet */}
      {showSwap&&<SwapSheet plan={plan} scheduledKey={scheduledKey} overrideKey={overrideKey} onPick={applyOverride} onClear={clearOverride} onClose={()=>setShowSwap(false)}/>}

      {/* Add exercise sheet */}
      {showAddEx&&(
        <div style={{position:'fixed',inset:0,zIndex:500,display:'flex',flexDirection:'column',justifyContent:'flex-end'}}>
          <div style={{position:'absolute',inset:0,background:'rgba(0,0,0,0.75)'}} onClick={()=>setShowAddEx(false)}/>
          <div style={{position:'relative',background:'#0f172a',borderRadius:'16px 16px 0 0',padding:16,maxHeight:'75vh',display:'flex',flexDirection:'column'}}>
            <div style={{color:'#94a3b8',fontSize:13,fontWeight:700,marginBottom:10}}>Add exercise to today</div>
            <input value={addExSearch} onChange={e=>setAddExSearch(e.target.value)} placeholder="Search..." style={{width:'100%',padding:'9px 12px',background:'#0a0f1a',border:'1px solid #1e293b',borderRadius:8,color:'#f1f5f9',fontSize:13,marginBottom:10}}/>
            <div style={{overflowY:'auto',flex:1}}>
              {filteredPool.map(ex=>(
                <button key={ex.name} onClick={()=>addExerciseOnTheFly(ex)} disabled={alreadyNames.has(ex.name)} style={{width:'100%',display:'flex',alignItems:'center',gap:10,padding:'10px 12px',background:'#0a0f1a',border:'1px solid #1e293b',borderRadius:8,marginBottom:4,cursor:alreadyNames.has(ex.name)?'default':'pointer',textAlign:'left',opacity:alreadyNames.has(ex.name)?0.4:1}}>
                  <div style={{flex:1}}>
                    <div style={{color:'#f1f5f9',fontSize:13}}>{ex.name}</div>
                    <div style={{color:'#475569',fontSize:11}}>{ex.category} · {ex.sets}×{ex.isPlank?'hold':ex.reps}{ex.bodyweight?'':`@${ex.defaultWeight}lb`}{ex.perSide?' /side':''}</div>
                  </div>
                  {alreadyNames.has(ex.name)&&<span style={{color:'#475569',fontSize:11}}>added</span>}
                </button>
              ))}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ─────────────────────────────────────────────────────────────────
// SWAP SHEET (reusable bottom sheet for changing today's workout)
// ─────────────────────────────────────────────────────────────────
function SwapSheet({plan,scheduledKey,overrideKey,onPick,onClear,onClose}) {
  return (
    <div style={{position:'fixed',inset:0,zIndex:500,display:'flex',flexDirection:'column',justifyContent:'flex-end'}}>
      <div style={{position:'absolute',inset:0,background:'rgba(0,0,0,0.75)'}} onClick={onClose}/>
      <div style={{position:'relative',background:'#0f172a',borderRadius:'16px 16px 0 0',padding:16,maxHeight:'72vh',overflowY:'auto'}}>
        <div style={{color:'#94a3b8',fontSize:13,fontWeight:700,marginBottom:4}}>Change today's workout</div>
        <div style={{color:'#475569',fontSize:12,marginBottom:12}}>This only changes today — your weekly schedule stays the same.</div>
        {Object.values(DAY_TYPES).map(dt=>{
          const isActive=(overrideKey||scheduledKey)===dt.key;
          const isScheduled=scheduledKey===dt.key&&!overrideKey;
          return (
            <button key={dt.key} onClick={()=>onPick(dt.key)}
              style={{width:'100%',display:'flex',alignItems:'center',gap:12,padding:'12px 14px',
                background:isActive?'#0c1929':'none',
                border:`1px solid ${isActive?'#3b82f6':'#1e293b'}`,
                borderRadius:8,marginBottom:6,cursor:'pointer',textAlign:'left'}}>
              <span style={{fontSize:22}}>{dt.emoji}</span>
              <div style={{flex:1}}>
                <div style={{color:'#f1f5f9',fontSize:14}}>{dt.name}</div>
                <div style={{color:'#475569',fontSize:11}}>{dt.type}{isScheduled?' · scheduled':''}</div>
              </div>
              {isActive&&<span style={{color:'#3b82f6',fontSize:16}}>✓</span>}
            </button>
          );
        })}
        {overrideKey&&overrideKey!==scheduledKey&&(

// ─────────────────────────────────────────────────────────────────
// WEIGHT CHART (pure SVG)
// ─────────────────────────────────────────────────────────────────
function WeightChart({data,goal}) {
  if (!data||data.length<2) return <div style={{height:160,display:'flex',alignItems:'center',justifyContent:'center',color:'#475569',fontSize:13}}>Log your first entry below</div>;
  const PAD={top:10,right:30,bottom:22,left:30};
  const W=340,H=170;
  const chartW=W-PAD.left-PAD.right,chartH=H-PAD.top-PAD.bottom;
  const weights=data.map(d=>d.w);
  const allVals=goal?[...weights,goal]:weights;
  const minW=Math.floor(Math.min(...allVals)-1);
  const maxW=Math.ceil(Math.max(...allVals)+1);
  const xS=(i)=>PAD.left+(i/(data.length-1))*chartW;
  const yS=(w)=>PAD.top+chartH-((w-minW)/(maxW-minW))*chartH;
  const pathD=data.map((d,i)=>`${i===0?'M':'L'} ${xS(i).toFixed(1)} ${yS(d.w).toFixed(1)}`).join(' ');
  // Y grid every 5kg
  const yVals=[];for(let v=Math.ceil(minW/5)*5;v<=maxW;v+=5)yVals.push(v);
  // X year labels — only show a subset
  const xLabels=[];
  data.forEach((d,i)=>{if(d.date.slice(5)==='01-01'||(i===0&&d.date.slice(5)!=='01-01'))xLabels.push({x:xS(i),label:d.date.slice(0,4)});});
  const step=Math.max(1,Math.ceil(xLabels.length/5));
  const goalY=goal?yS(goal):null;
  // Split path into historical (grey) and user-logged (blue)
  const splitIdx=data.findIndex(d=>d.userLogged);
  const histPath=splitIdx<0?pathD:(splitIdx===0?'':data.slice(0,splitIdx+1).map((d,i)=>`${i===0?'M':'L'} ${xS(i).toFixed(1)} ${yS(d.w).toFixed(1)}`).join(' '));
  const userPath=splitIdx<0?'':data.slice(splitIdx).map((d,i)=>`${i===0?'M':'L'} ${xS(splitIdx+i).toFixed(1)} ${yS(d.w).toFixed(1)}`).join(' ');

  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%',height:'auto',display:'block'}}>
      {yVals.map(v=>(
        <g key={v}>
          <line x1={PAD.left} y1={yS(v)} x2={W-PAD.right} y2={yS(v)} stroke="#1e293b" strokeWidth={1}/>
          <text x={PAD.left-4} y={yS(v)+3} fontSize={8} fill="#475569" textAnchor="end">{v}</text>
        </g>
      ))}
      {goalY&&<>
        <line x1={PAD.left} y1={goalY} x2={W-PAD.right} y2={goalY} stroke="#22c55e" strokeWidth={1.5} strokeDasharray="5,3"/>
        <text x={W-PAD.right+3} y={goalY+3} fontSize={8} fill="#22c55e">goal</text>
      </>}
      {histPath&&<path d={histPath} fill="none" stroke="#475569" strokeWidth={1.5}/>}
      {userPath&&<path d={userPath} fill="none" stroke="#3b82f6" strokeWidth={2}/>}
      {!histPath&&<path d={pathD} fill="none" stroke="#3b82f6" strokeWidth={2}/>}
      {/* Dots for user-logged entries */}
      {data.filter(d=>d.userLogged).map((d,i)=>{
        const idx=data.findIndex(x=>x.date===d.date);
        return <circle key={i} cx={xS(idx)} cy={yS(d.w)} r={3} fill="#3b82f6" stroke="#05080f" strokeWidth={1}/>;
      })}
      {xLabels.filter((_,i)=>i%step===0).map(l=>(
        <text key={l.label} x={l.x} y={H-4} fontSize={8} fill="#475569" textAnchor="middle">{l.label}</text>
      ))}
    </svg>
  );
}

// WEIGHT TAB

function WeightTab() {
  const [weightLog,setWeightLog]=React.useState(()=>loadWeightLog());
  const [newDate,setNewDate]=React.useState(todayStr());
  const [newWeight,setNewWeight]=React.useState('');
  const [saved,setSaved]=React.useState(false);
  const [range,setRange]=React.useState('recent'); // 'recent' | 'all'
  const [goal,setGoal]=React.useState(()=>{try{return parseFloat(localStorage.getItem('weight-goal-v1'))||86;}catch(e){return 86;}});
  const [editGoal,setEditGoal]=React.useState(false);
  const [goalInput,setGoalInput]=React.useState(String(goal));
  const [showDeleteConfirm,setShowDeleteConfirm]=React.useState(null);

  // Merge historical + user-logged, deduplicate by date (user entries win)
  const allData=React.useMemo(()=>{
    const map=new Map();
    HISTORICAL_WEIGHT.forEach(d=>map.set(d.date,{...d,userLogged:false}));
    weightLog.forEach(d=>map.set(d.date,{...d,userLogged:true}));
    return [...map.values()].sort((a,b)=>a.date.localeCompare(b.date));
  },[weightLog]);

  const cutoff=range==='recent'?'2019-01-01':'2000-01-01';
  const displayData=allData.filter(d=>d.date>=cutoff);

  const latest=allData.length?allData[allData.length-1]:null;
  const delta=latest?(latest.w-goal).toFixed(1):null;
  const trendData=allData.slice(-6);
  const trend=trendData.length>=2?(trendData[trendData.length-1].w-trendData[0].w).toFixed(1):null;

  function logWeight() {
    const wVal=parseFloat(newWeight);
    if (!newWeight||isNaN(wVal)||wVal<40||wVal>200) return;
    const entry={date:newDate,w:wVal,userLogged:true};
    setWeightLog(prev=>{const updated=[...prev.filter(e=>e.date!==newDate),entry];saveWeightLog(updated);return updated;});
    setNewWeight('');setSaved(true);setTimeout(()=>setSaved(false),2000);
  }
  function deleteEntry(date) {
    setWeightLog(prev=>{const updated=prev.filter(e=>e.date!==date);saveWeightLog(updated);return updated;});
    setShowDeleteConfirm(null);
  }
  function saveGoal() {
    const v=parseFloat(goalInput);
    if (!isNaN(v)&&v>40&&v<200){setGoal(v);localStorage.setItem('weight-goal-v1',String(v));}
    setEditGoal(false);
  }

  const card={background:'#0f172a',border:'1px solid #1e293b',borderRadius:12,padding:14,marginBottom:12};
  const btn=(col)=>({padding:'8px 14px',fontFamily:'Georgia,serif',fontSize:12,cursor:'pointer',background:col==='blue'?'#1e3a5f':'none',border:`1px solid ${col==='blue'?'#3b82f6':'#1e293b'}`,borderRadius:8,color:col==='blue'?'#93c5fd':'#94a3b8'});

  const recentUserEntries=[...weightLog].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,10);

  return (
    <div style={{padding:'16px 16px 90px'}}>
      {/* Stats strip */}
      <div style={{display:'flex',gap:8,marginBottom:16}}>
        {[
          {label:'Current',value:latest?`${latest.w} kg`:'—',sub:latest?latest.date.slice(0,7):null},
          {label:'Goal',value:`${goal} kg`,clickable:true},
          {label:'To go',value:delta?`${parseFloat(delta)>0?'+':''}${delta} kg`:'—',color:delta&&parseFloat(delta)<0?'#4ade80':parseFloat(delta)>0?'#f97316':'#f1f5f9'},
          {label:'6mo trend',value:trend?`${parseFloat(trend)>0?'+':''}${trend} kg`:'—',color:trend&&parseFloat(trend)<0?'#4ade80':parseFloat(trend)>0?'#f97316':'#f1f5f9'},
        ].map(item=>(
          <div key={item.label} onClick={item.clickable?()=>setEditGoal(true):undefined}
            style={{flex:1,background:'#0f172a',border:`1px solid ${item.clickable?'#1e3a5f':'#1e293b'}`,borderRadius:10,padding:'10px 4px',textAlign:'center',cursor:item.clickable?'pointer':'default'}}>
            <div style={{color:item.color||'#f1f5f9',fontWeight:700,fontSize:item.value.length>7?13:16}}>{item.value}</div>
            <div style={{color:'#475569',fontSize:10}}>{item.label}{item.clickable&&<span style={{color:'#3b82f6'}}> ✎</span>}</div>
            {item.sub&&<div style={{color:'#334155',fontSize:9}}>{item.sub}</div>}
          </div>
        ))}
      </div>

      {/* Goal editor */}
      {editGoal&&(
        <div style={{...card,border:'1px solid #1e3a5f'}}>
          <div style={{color:'#94a3b8',fontSize:13,fontWeight:700,marginBottom:8}}>Set goal weight (kg)</div>
          <div style={{display:'flex',gap:8}}>
            <input type="number" value={goalInput} onChange={e=>setGoalInput(e.target.value)} style={{flex:1,padding:'10px',background:'#0a0f1a',border:'1px solid #1e3a5f',borderRadius:8,color:'#f1f5f9',fontSize:16,textAlign:'center'}}/>
            <button onClick={saveGoal} style={{...btn('blue'),padding:'10px 16px',fontSize:14}}>Save</button>
            <button onClick={()=>setEditGoal(false)} style={{...btn(),padding:'10px 12px'}}>✕</button>
          </div>
        </div>
      )}

      {/* Chart */}
      <div style={card}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
          <div style={{color:'#94a3b8',fontSize:13,fontWeight:700}}>📈 Weight History</div>
          <div style={{display:'flex',gap:4}}>
            {['recent','all'].map(r=>(
              <button key={r} onClick={()=>setRange(r)} style={{...btn(range===r?'blue':''),padding:'5px 10px',fontSize:11}}>
                {r==='recent'?'2019+':'All time'}
              </button>
            ))}
          </div>
        </div>
        <WeightChart data={displayData} goal={goal}/>
        <div style={{display:'flex',gap:16,marginTop:8,fontSize:11,color:'#475569'}}>
          <span style={{display:'flex',alignItems:'center',gap:4}}><svg width="16" height="4"><line x1="0" y1="2" x2="16" y2="2" stroke="#475569" strokeWidth="2"/></svg>historical</span>
          <span style={{display:'flex',alignItems:'center',gap:4}}><svg width="16" height="4"><line x1="0" y1="2" x2="16" y2="2" stroke="#3b82f6" strokeWidth="2"/></svg>logged</span>
          <span style={{display:'flex',alignItems:'center',gap:4}}><svg width="16" height="4"><line x1="0" y1="2" x2="16" y2="2" stroke="#22c55e" strokeWidth="1.5" strokeDasharray="4,2"/></svg>goal</span>
        </div>
      </div>

      {/* Log new entry */}
      <div style={card}>
        <div style={{color:'#94a3b8',fontSize:13,fontWeight:700,marginBottom:10}}>Log Weight</div>
        <div style={{display:'flex',gap:8,alignItems:'flex-end'}}>
          <div style={{flex:1}}>
            <div style={{color:'#64748b',fontSize:11,marginBottom:4}}>Date</div>
            <input type="date" value={newDate} onChange={e=>setNewDate(e.target.value)} style={{width:'100%',padding:'10px',background:'#0a0f1a',border:'1px solid #1e293b',borderRadius:8,color:'#f1f5f9',fontSize:13}}/>
          </div>
          <div style={{width:90}}>
            <div style={{color:'#64748b',fontSize:11,marginBottom:4}}>Weight (kg)</div>
            <input type="number" value={newWeight} onChange={e=>setNewWeight(e.target.value)} placeholder="e.g. 89.5" step="0.1" style={{width:'100%',padding:'10px',background:'#0a0f1a',border:'1px solid #1e3a5f',borderRadius:8,color:'#f1f5f9',fontSize:15,textAlign:'center'}}/>
          </div>
          <button onClick={logWeight} disabled={!newWeight} style={{...btn('blue'),padding:'10px 14px',fontSize:14,opacity:newWeight?1:0.4}}>{saved?'✓':'Save'}</button>
        </div>
      </div>

      {/* Recent user-logged entries */}
      {recentUserEntries.length>0&&(
        <div style={card}>
          <div style={{color:'#94a3b8',fontSize:13,fontWeight:700,marginBottom:10}}>Your logged entries</div>
          {recentUserEntries.map(entry=>(
            <div key={entry.date} style={{display:'flex',alignItems:'center',gap:10,padding:'8px 0',borderBottom:'1px solid #0f172a'}}>
              <div style={{flex:1}}>
                <div style={{color:'#f1f5f9',fontSize:14,fontWeight:700}}>{entry.w} kg</div>
                <div style={{color:'#475569',fontSize:12}}>{getDayLabel(entry.date)}</div>
              </div>
              {goal&&<div style={{color:entry.w<=goal?'#4ade80':'#94a3b8',fontSize:13}}>{entry.w<=goal?'✓ at goal':`${(entry.w-goal).toFixed(1)} to go`}</div>}
              {showDeleteConfirm===entry.date?(
                <div style={{display:'flex',gap:4}}>
                  <button onClick={()=>deleteEntry(entry.date)} style={{padding:'5px 8px',background:'#3f1515',border:'1px solid #ef4444',borderRadius:6,color:'#ef4444',cursor:'pointer',fontSize:11}}>Delete</button>
                  <button onClick={()=>setShowDeleteConfirm(null)} style={{padding:'5px 8px',background:'none',border:'1px solid #1e293b',borderRadius:6,color:'#475569',cursor:'pointer',fontSize:11}}>Cancel</button>
                </div>
              ):(
                <button onClick={()=>setShowDeleteConfirm(entry.date)} style={{padding:'5px 8px',background:'none',border:'1px solid #1e293b',borderRadius:6,color:'#475569',cursor:'pointer',fontSize:11}}>✕</button>
              )}
            </div>
          ))}
        </div>
      )}

      {weightLog.length===0&&(
        <div style={{textAlign:'center',color:'#475569',fontSize:13,padding:'8px 0 16px'}}>
          Historical data pre-loaded (2011–2021). Log your first entry above to start tracking your current progress.
        </div>
      )}
    </div>
  );
}

function SettingsTab({settings,onSaveSetting}) {
  const [urlInput,setUrlInput]=React.useState(loadLocal().backendUrl||BACKEND);
  const [testStatus,setTestStatus]=React.useState('');
  const [startDate,setStartDate]=React.useState(settings?.startDate||'');
  const [openGuide,setOpenGuide]=React.useState(null);
  const [defaults,setDefaults]=React.useState(()=>{try{return settings?.customDefaults?JSON.parse(settings.customDefaults):{};}catch(e){return{};}});
  const [defaultsSaved,setDefaultsSaved]=React.useState(false);
  const [weekTemplate,setWeekTemplate]=React.useState(()=>{try{return settings?.weekTemplate?JSON.parse(settings.weekTemplate):{...DEFAULT_WEEK};}catch(e){return{...DEFAULT_WEEK};}});
  const [weekSaved,setWeekSaved]=React.useState(false);
  const [pickingDay,setPickingDay]=React.useState(null);
  const getDefaultOverrides=()=>({upper:[...DAY_TYPES.upper.defaultExercises],lower:[...DAY_TYPES.lower.defaultExercises],full:[...DAY_TYPES.full.defaultExercises]});
  const [exOverrides,setExOverrides]=React.useState(()=>{try{return settings?.exerciseOverrides?JSON.parse(settings.exerciseOverrides):getDefaultOverrides();}catch(e){return getDefaultOverrides();}});
  const [exSaved,setExSaved]=React.useState(false);
  const [exSearch,setExSearch]=React.useState('');
  const [pickingFor,setPickingFor]=React.useState(null);
  const [customMode,setCustomMode]=React.useState(false);
  const [customEx,setCustomEx]=React.useState({name:'',sets:3,reps:10,weight:15,bodyweight:false,perSide:false});

  async function testUrl(){setTestStatus('Testing...');const prev=loadLocal();saveLocal({...prev,backendUrl:urlInput});const res=await api({action:'get_all'});setTestStatus(res?.ok?'✓ Connected!':'✗ Could not reach — check deployment settings');}
  function saveUrl(){const prev=loadLocal();saveLocal({...prev,backendUrl:urlInput});setTestStatus('Saved.');}
  function saveStartDate(){onSaveSetting('startDate',startDate);}
  function updateDefault(exName,field,value){setDefaults(prev=>({...prev,[exName]:{...(prev[exName]||{}),[field]:value}}));setDefaultsSaved(false);}
  function saveDefaults(){onSaveSetting('customDefaults',JSON.stringify(defaults));setDefaultsSaved(true);setTimeout(()=>setDefaultsSaved(false),2000);}
  function saveWeek(){onSaveSetting('weekTemplate',JSON.stringify(weekTemplate));setWeekSaved(true);setTimeout(()=>setWeekSaved(false),2000);}
  function saveExercises(){onSaveSetting('exerciseOverrides',JSON.stringify(exOverrides));setExSaved(true);setTimeout(()=>setExSaved(false),2000);}
  function removeExercise(typeKey,idx){setExOverrides(prev=>{const arr=[...(prev[typeKey]||[])];arr.splice(idx,1);return{...prev,[typeKey]:arr}});setExSaved(false);}
  function swapOrAddExercise(ex){
    if(!pickingFor)return;
    const{typeKey,swapIdx}=pickingFor;
    setExOverrides(prev=>{const arr=[...(prev[typeKey]||[])];const newEx={name:ex.name,sets:ex.sets,...(ex.isPlank?{isPlank:true}:{reps:ex.reps}),...(ex.bodyweight?{bodyweight:true}:(ex.defaultWeight?{defaultWeight:ex.defaultWeight}:{})),...(ex.perSide?{perSide:true}:{})};if(swapIdx===null)arr.push(newEx);else arr[swapIdx]=newEx;return{...prev,[typeKey]:arr}});
    setPickingFor(null);setExSearch('');setCustomMode(false);setExSaved(false);
  }
  function addCustomExercise(){
    if(!customEx.name.trim())return;
    const ex={name:customEx.name.trim(),sets:customEx.sets,reps:customEx.reps,...(customEx.bodyweight?{bodyweight:true}:{defaultWeight:customEx.weight}),...(customEx.perSide?{perSide:true}:{})};
    swapOrAddExercise(ex);
    setCustomEx({name:'',sets:3,reps:10,weight:15,bodyweight:false,perSide:false});
  }

  // Shuffle: randomly reassign workout types to days while keeping the same mix
  function shuffleWeek() {
    const keys=Object.keys(weekTemplate);
    const vals=Object.values(weekTemplate);
    // Fisher-Yates shuffle
    for(let i=vals.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[vals[i],vals[j]]=[vals[j],vals[i]];}
    const newTemplate={};keys.forEach((k,i)=>newTemplate[k]=vals[i]);
    setWeekTemplate(newTemplate);setWeekSaved(false);
  }

  const DOW_NAMES=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const STRENGTH_TYPES=['upper','lower','full'];
  const allExForDefaults=React.useMemo(()=>{const seen=new Set();const result=[];STRENGTH_TYPES.forEach(tk=>{(exOverrides[tk]||[]).forEach(ex=>{if(!seen.has(ex.name)){seen.add(ex.name);result.push(ex);}});});return result;},[exOverrides]);
  const card={background:'#0f172a',border:'1px solid #1e293b',borderRadius:12,padding:16,marginBottom:12};
  const h={fontSize:14,color:'#94a3b8',fontWeight:700,marginBottom:8};
  const sub={color:'#64748b',fontSize:13,marginBottom:10,lineHeight:1.5};
  const inp={width:'100%',padding:'10px 12px',background:'#0a0f1a',border:'1px solid #1e293b',borderRadius:8,color:'#f1f5f9',fontSize:13,marginBottom:8};
  const btn=(col)=>({padding:'9px 18px',fontFamily:'Georgia,serif',fontSize:13,cursor:'pointer',background:col==='blue'?'#1e3a5f':'none',border:`1px solid ${col==='blue'?'#3b82f6':'#1e293b'}`,borderRadius:8,color:col==='blue'?'#93c5fd':'#94a3b8'});
  const numInp={width:58,padding:'7px',background:'#0a0f1a',border:'1px solid #1e3a5f',borderRadius:6,color:'#f1f5f9',fontSize:15,textAlign:'center'};
  const filteredPool=exSearch.trim()?EXERCISE_POOL.filter(e=>e.name.toLowerCase().includes(exSearch.toLowerCase())):EXERCISE_POOL;
  const poolByCategory={};filteredPool.forEach(e=>{(poolByCategory[e.category]=poolByCategory[e.category]||[]).push(e);});

  return (
    <div style={{padding:'16px 16px 90px'}}>

      {/* Weekly Schedule */}
      <div style={card}>
        <div style={h}>📅 Weekly Schedule</div>
        <div style={sub}>Tap a day to change its workout type.</div>
        {[1,2,3,4,5,6,0].map(dow=>{
          const typeKey=weekTemplate[String(dow)]||DEFAULT_WEEK[String(dow)];
          const dt=DAY_TYPES[typeKey]||DAY_TYPES.rest;
          const isToday=new Date().getDay()===dow;
          return (
            <button key={dow} onClick={()=>setPickingDay(String(dow))} style={{width:'100%',display:'flex',alignItems:'center',gap:10,padding:'10px 12px',background:isToday?'#0c1929':'#0a0f1a',border:`1px solid ${isToday?'#1e3a5f':'#1e293b'}`,borderRadius:8,marginBottom:6,cursor:'pointer',textAlign:'left'}}>
              <span style={{color:isToday?'#93c5fd':'#475569',fontSize:13,fontWeight:700,width:32,flexShrink:0}}>{DOW_NAMES[dow]}</span>
              <span style={{fontSize:18}}>{dt.emoji}</span>
              <span style={{color:'#cbd5e1',fontSize:13,flex:1}}>{dt.name}</span>
              <span style={{color:'#475569',fontSize:16}}>›</span>
            </button>
          );
        })}
        <div style={{display:'flex',gap:8,marginTop:4}}>
          <button onClick={shuffleWeek} style={{...btn('grey'),flex:1,padding:'10px',fontSize:13}}>🔀 Shuffle</button>
          <button onClick={saveWeek} style={{...btn('blue'),flex:2,padding:'10px',fontSize:13}}>{weekSaved?'✓ Saved!':'Save Schedule'}</button>
        </div>
      </div>

      {/* Customize Exercises */}
      <div style={card}>
        <div style={h}>🔄 Customize Exercises</div>
        <div style={sub}>Change which exercises are in each workout. Tap ⇄ to swap, ✕ to remove, or add new ones.</div>
        {STRENGTH_TYPES.map(typeKey=>{
          const dt=DAY_TYPES[typeKey];
          const exercises=exOverrides[typeKey]||dt.defaultExercises;
          return (
            <div key={typeKey} style={{marginBottom:16}}>
              <div style={{color:'#475569',fontSize:12,fontWeight:700,marginBottom:8,textTransform:'uppercase',letterSpacing:1}}>{dt.emoji} {dt.name}</div>
              {exercises.map((ex,i)=>(
                <div key={i} style={{display:'flex',alignItems:'center',gap:8,marginBottom:6,background:'#0a0f1a',border:'1px solid #1e293b',borderRadius:8,padding:'8px 10px'}}>
                  <span style={{color:'#94a3b8',fontSize:13,flex:1}}>{ex.name}</span>
                  <span style={{color:'#475569',fontSize:11,flexShrink:0}}>{ex.isPlank?'timer':`${ex.sets}×${ex.reps}${ex.bodyweight?'':` @${ex.defaultWeight}lb`}${ex.perSide?'/side':''}`}</span>
                  <button onClick={()=>{setPickingFor({typeKey,swapIdx:i});setExSearch('');setCustomMode(false);}} style={{background:'none',border:'1px solid #1e3a5f',borderRadius:6,color:'#93c5fd',padding:'4px 8px',fontSize:12,cursor:'pointer',flexShrink:0}}>⇄</button>
                  <button onClick={()=>{if(exercises.length>1)removeExercise(typeKey,i);}} style={{background:'none',border:'1px solid #3f1515',borderRadius:6,color:'#ef4444',padding:'4px 8px',fontSize:12,cursor:'pointer',flexShrink:0,opacity:exercises.length>1?1:0.3}}>✕</button>
                </div>
              ))}
              <button onClick={()=>{setPickingFor({typeKey,swapIdx:null});setExSearch('');setCustomMode(false);}} style={{...btn('grey'),fontSize:12,padding:'7px 14px'}}>+ Add exercise</button>
            </div>
          );
        })}
        <button onClick={saveExercises} style={{...btn('blue'),width:'100%',padding:'11px',fontSize:14}}>{exSaved?'✓ Exercises Saved!':'Save Exercises'}</button>
      </div>

      {/* Default Reps & Weights */}
      <div style={card}>
        <div style={h}>⚖️ Default Reps & Weights</div>
        <div style={sub}>These become the starting values every time you log. Bump weight after 2 solid weeks.</div>
        {allExForDefaults.map(ex=>{
          if(ex.isPlank)return(<div key={ex.name} style={{display:'flex',alignItems:'center',gap:10,marginBottom:8}}><span style={{color:'#94a3b8',fontSize:13,flex:1}}>Plank</span><span style={{color:'#475569',fontSize:12}}>Timer — no default reps</span></div>);
          const cur=defaults[ex.name]||{};
          return (
            <div key={ex.name} style={{display:'flex',alignItems:'center',gap:8,marginBottom:10}}>
              <span style={{color:'#94a3b8',fontSize:13,flex:1,lineHeight:1.3}}>{ex.name}</span>
              <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:2}}>
                <input type="number" value={cur.reps??ex.reps??''} onChange={e=>updateDefault(ex.name,'reps',Number(e.target.value))} style={numInp}/>
                <span style={{color:'#475569',fontSize:10}}>reps</span>
              </div>
              {!ex.bodyweight&&<div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:2}}>
                <input type="number" value={cur.weight??ex.defaultWeight??''} onChange={e=>updateDefault(ex.name,'weight',Number(e.target.value))} style={numInp}/>
                <span style={{color:'#475569',fontSize:10}}>lbs</span>
              </div>}
            </div>
          );
        })}
        <button onClick={saveDefaults} style={{...btn('blue'),width:'100%',padding:'12px',fontSize:14}}>{defaultsSaved?'✓ Saved!':'Save as My Defaults'}</button>
      </div>

      {/* Exercise Guide */}
      <div style={card}>
        <div style={h}>📖 Exercise Guide</div>
        <div style={sub}>Tap any exercise for instructions and tips.</div>
        {Object.entries(EXERCISE_GUIDE).map(([dow,exercises])=>{
          const planDay=PLAN[Number(dow)];
          return (
            <div key={dow} style={{marginBottom:4}}>
              <div style={{color:'#475569',fontSize:12,fontWeight:700,marginBottom:6,textTransform:'uppercase',letterSpacing:1}}>{planDay?.emoji} {planDay?.name}</div>
              {exercises.map(guide=>{
                const planEx=(planDay?.exercises||[]).find(e=>e.name===guide.name)||{};
                const isOpen=openGuide===guide.name;
                const target=guide.name==='Plank'?`${planEx.sets||3} rounds, hold as long as you can`:`${planEx.sets||3} × ${planEx.reps??'?'} reps${!planEx.bodyweight&&planEx.defaultWeight?` @ ${planEx.defaultWeight} lbs`:''}${planEx.perSide?' each side':''}`;
                return (
                  <div key={guide.name} style={{marginBottom:6,background:'#0a0f1a',border:`1px solid ${isOpen?'#1e3a5f':'#1e293b'}`,borderRadius:10,overflow:'hidden'}}>
                    <button onClick={()=>setOpenGuide(isOpen?null:guide.name)} style={{width:'100%',padding:'11px 14px',background:'none',border:'none',display:'flex',alignItems:'center',justifyContent:'space-between',cursor:'pointer',textAlign:'left'}}>
                      <div><div style={{color:'#f1f5f9',fontSize:14,fontWeight:700}}>{guide.name}</div><div style={{color:'#475569',fontSize:11,marginTop:2}}>{target}</div></div>
                      <span style={{color:'#475569',fontSize:14}}>{isOpen?'▲':'▽'}</span>
                    </button>
                    {isOpen&&<div style={{padding:'0 14px 14px',borderTop:'1px solid #1e293b'}}>
                      <div style={{color:'#64748b',fontSize:12,marginBottom:6,marginTop:10}}>🎯 <span style={{color:'#94a3b8'}}>Muscles:</span> {guide.muscles}</div>
                      <div style={{color:'#cbd5e1',fontSize:13,lineHeight:1.7,marginBottom:10}}>{guide.how}</div>
                      <div style={{display:'flex',flexDirection:'column',gap:6}}>
                        <div style={{background:'#1c2a1c',border:'1px solid #166534',borderRadius:7,padding:'7px 10px',fontSize:12,color:'#86efac'}}><span style={{color:'#4ade80',fontWeight:700}}>Too hard?</span> {guide.tooHard}</div>
                        <div style={{background:'#1a1f2e',border:'1px solid #1e3a5f',borderRadius:7,padding:'7px 10px',fontSize:12,color:'#93c5fd'}}><span style={{color:'#60a5fa',fontWeight:700}}>Too easy?</span> {guide.tooEasy}</div>
                      </div>
                    </div>}
                  </div>
                );
              })}
            </div>
          );
        })}
        <div style={{marginTop:8}}>
          <div style={{color:'#475569',fontSize:12,fontWeight:700,marginBottom:6,textTransform:'uppercase',letterSpacing:1}}>Cardio & Rest</div>
          {[{name:'Brisk Walk 🚶',target:'30 min',tip:'Breathing harder than normal but still able to talk. Not a stroll — move with purpose.'},{name:'Easy Walk / Bike 🌤️',target:'40 min',tip:'Relaxed pace — 30–45 min. Good for fat burning without wearing you out.'},{name:'Rest & Stretch 🧘',target:'Once through',tip:'Overhead 20s · Toe touch 20s · Hip flexor 20s each · Neck rolls. Recovery is when muscles grow.'},{name:'Full Rest 😴',target:'All day',tip:'Eat 160g+ protein, sleep 8 hours. Muscles grow on rest days.'}].map(item=>{
            const isOpen=openGuide===item.name;
            return (
              <div key={item.name} style={{marginBottom:6,background:'#0a0f1a',border:`1px solid ${isOpen?'#1e3a5f':'#1e293b'}`,borderRadius:10,overflow:'hidden'}}>
                <button onClick={()=>setOpenGuide(isOpen?null:item.name)} style={{width:'100%',padding:'11px 14px',background:'none',border:'none',display:'flex',alignItems:'center',justifyContent:'space-between',cursor:'pointer',textAlign:'left'}}>
                  <div><div style={{color:'#f1f5f9',fontSize:14,fontWeight:700}}>{item.name}</div><div style={{color:'#475569',fontSize:11,marginTop:2}}>{item.target}</div></div>
                  <span style={{color:'#475569',fontSize:14}}>{isOpen?'▲':'▽'}</span>
                </button>
                {isOpen&&<div style={{padding:'0 14px 14px',borderTop:'1px solid #1e293b'}}><div style={{color:'#cbd5e1',fontSize:13,lineHeight:1.7,marginTop:10}}>{item.tip}</div></div>}
              </div>
            );
          })}
        </div>
      </div>

      {/* Training Start Date */}
      <div style={card}>
        <div style={h}>📆 Training Start Date</div>
        <div style={sub}>Set this to track your 2-week progression cycles (when to add weight).</div>
        <input type="date" value={startDate} onChange={e=>setStartDate(e.target.value)} style={inp}/>
        <button onClick={saveStartDate} style={btn('blue')}>Save Date</button>
      </div>

      {/* Cloud Sync */}
      <div style={card}>
        <div style={h}>☁️ Cloud Sync (Google Sheets)</div>
        <div style={sub}>Paste your Apps Script /exec URL to back up your data and sync across devices.</div>
        <input value={urlInput} onChange={e=>setUrlInput(e.target.value)} placeholder="https://script.google.com/macros/s/.../exec" style={{...inp,fontSize:11}}/>
        <div style={{display:'flex',gap:8,marginBottom:8}}>
          <button onClick={testUrl} style={btn('grey')}>Test</button>
          <button onClick={saveUrl} style={btn('blue')}>Save URL</button>
        </div>
        {testStatus&&<div style={{fontSize:13,color:testStatus.startsWith('✓')||testStatus==='Saved.'?'#22c55e':'#ef4444'}}>{testStatus}</div>}
      </div>

      {/* Day type picker */}
      {pickingDay!==null&&(
        <div style={{position:'fixed',inset:0,zIndex:500,display:'flex',flexDirection:'column',justifyContent:'flex-end'}}>
          <div style={{position:'absolute',inset:0,background:'rgba(0,0,0,0.75)'}} onClick={()=>setPickingDay(null)}/>
          <div style={{position:'relative',background:'#0f172a',borderRadius:'16px 16px 0 0',padding:16,maxHeight:'70vh',overflowY:'auto'}}>
            <div style={{color:'#94a3b8',fontSize:13,fontWeight:700,marginBottom:12}}>Choose workout for {DOW_NAMES[Number(pickingDay)]}</div>
            {Object.values(DAY_TYPES).map(dt=>(
              <button key={dt.key} onClick={()=>{setWeekTemplate(prev=>({...prev,[pickingDay]:dt.key}));setPickingDay(null);setWeekSaved(false);}} style={{width:'100%',display:'flex',alignItems:'center',gap:12,padding:'12px 14px',background:weekTemplate[pickingDay]===dt.key?'#0c1929':'none',border:`1px solid ${weekTemplate[pickingDay]===dt.key?'#3b82f6':'#1e293b'}`,borderRadius:8,marginBottom:6,cursor:'pointer',textAlign:'left'}}>
                <span style={{fontSize:22}}>{dt.emoji}</span>
                <div><div style={{color:'#f1f5f9',fontSize:14}}>{dt.name}</div><div style={{color:'#475569',fontSize:11}}>{dt.type}</div></div>
                {weekTemplate[pickingDay]===dt.key&&<span style={{marginLeft:'auto',color:'#3b82f6'}}>✓</span>}
              </button>
            ))}
          </div>
        </div>
      )}

      {/* Exercise picker */}
      {pickingFor!==null&&!customMode&&(
        <div style={{position:'fixed',inset:0,zIndex:500,display:'flex',flexDirection:'column',justifyContent:'flex-end'}}>
          <div style={{position:'absolute',inset:0,background:'rgba(0,0,0,0.75)'}} onClick={()=>{setPickingFor(null);setExSearch('');}}/>
          <div style={{position:'relative',background:'#0f172a',borderRadius:'16px 16px 0 0',padding:16,maxHeight:'78vh',display:'flex',flexDirection:'column'}}>
            <div style={{color:'#94a3b8',fontSize:13,fontWeight:700,marginBottom:10}}>{pickingFor.swapIdx===null?'Add exercise':'Swap exercise'}{' — '}{DAY_TYPES[pickingFor.typeKey]?.emoji} {DAY_TYPES[pickingFor.typeKey]?.name}</div>
            <input value={exSearch} onChange={e=>setExSearch(e.target.value)} placeholder="Search exercises..." style={{...inp,marginBottom:10}}/>
            <div style={{overflowY:'auto',flex:1}}>
              {['upper','lower','full'].filter(cat=>poolByCategory[cat]).map(cat=>(
                <div key={cat} style={{marginBottom:12}}>
                  <div style={{color:'#475569',fontSize:11,fontWeight:700,textTransform:'uppercase',letterSpacing:1,marginBottom:6}}>{cat}</div>
                  {poolByCategory[cat].map(ex=>(
                    <button key={ex.name} onClick={()=>swapOrAddExercise(ex)} style={{width:'100%',display:'flex',alignItems:'center',gap:10,padding:'10px 12px',background:'#0a0f1a',border:'1px solid #1e293b',borderRadius:8,marginBottom:4,cursor:'pointer',textAlign:'left'}}>
                      <div style={{flex:1}}><div style={{color:'#f1f5f9',fontSize:13}}>{ex.name}</div><div style={{color:'#475569',fontSize:11}}>{ex.sets}×{ex.isPlank?'hold':ex.reps}{ex.bodyweight?'':` @ ${ex.defaultWeight}lb`}{ex.perSide?' /side':''}</div></div>
                    </button>
                  ))}
                </div>
              ))}
              {filteredPool.length===0&&<div style={{color:'#475569',fontSize:13,textAlign:'center',padding:16}}>No exercises found</div>}
              <button onClick={()=>setCustomMode(true)} style={{...btn('grey'),width:'100%',padding:'11px',fontSize:13,marginTop:4}}>+ Create custom exercise</button>
            </div>
          </div>
        </div>
      )}

      {/* Custom exercise creator */}
      {pickingFor!==null&&customMode&&(
        <div style={{position:'fixed',inset:0,zIndex:500,display:'flex',flexDirection:'column',justifyContent:'flex-end'}}>
          <div style={{position:'absolute',inset:0,background:'rgba(0,0,0,0.75)'}} onClick={()=>setCustomMode(false)}/>
          <div style={{position:'relative',background:'#0f172a',borderRadius:'16px 16px 0 0',padding:16,maxHeight:'80vh',overflowY:'auto'}}>
            <div style={{color:'#94a3b8',fontSize:13,fontWeight:700,marginBottom:12}}>Create Custom Exercise</div>
            <input value={customEx.name} onChange={e=>setCustomEx(p=>({...p,name:e.target.value}))} placeholder="Exercise name" style={inp}/>
            <div style={{display:'flex',gap:10,marginBottom:10}}>
              <div style={{flex:1}}><div style={{color:'#64748b',fontSize:11,marginBottom:4}}>Sets</div><input type="number" value={customEx.sets} min={1} onChange={e=>setCustomEx(p=>({...p,sets:Number(e.target.value)}))} style={{...numInp,width:'100%'}}/></div>
              <div style={{flex:1}}><div style={{color:'#64748b',fontSize:11,marginBottom:4}}>Reps</div><input type="number" value={customEx.reps} min={1} onChange={e=>setCustomEx(p=>({...p,reps:Number(e.target.value)}))} style={{...numInp,width:'100%'}}/></div>
              {!customEx.bodyweight&&<div style={{flex:1}}><div style={{color:'#64748b',fontSize:11,marginBottom:4}}>Weight (lb)</div><input type="number" value={customEx.weight} min={0} onChange={e=>setCustomEx(p=>({...p,weight:Number(e.target.value)}))} style={{...numInp,width:'100%'}}/></div>}
            </div>
            <div style={{display:'flex',gap:16,marginBottom:14}}>
              <label style={{display:'flex',alignItems:'center',gap:6,color:'#94a3b8',fontSize:13,cursor:'pointer'}}><input type="checkbox" checked={customEx.bodyweight} onChange={e=>setCustomEx(p=>({...p,bodyweight:e.target.checked}))}/>Bodyweight</label>
              <label style={{display:'flex',alignItems:'center',gap:6,color:'#94a3b8',fontSize:13,cursor:'pointer'}}><input type="checkbox" checked={customEx.perSide} onChange={e=>setCustomEx(p=>({...p,perSide:e.target.checked}))}/>Per side</label>
            </div>
            <div style={{display:'flex',gap:8}}>
              <button onClick={()=>setCustomMode(false)} style={{...btn('grey'),flex:1,padding:'11px'}}>← Back</button>
              <button onClick={addCustomExercise} disabled={!customEx.name.trim()} style={{...btn('blue'),flex:2,padding:'11px',opacity:customEx.name.trim()?1:0.4}}>Add to Workout</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ─────────────────────────────────────────────────────────────────
// ROOT APP
// ─────────────────────────────────────────────────────────────────
function App() {
  const [screen,setScreen]=React.useState('loading');
  const [tab,setTab]=React.useState('today');
  const [sessions,setSessions]=React.useState([]);
  const [settings,setSettings]=React.useState({});
  const [syncDot,setSyncDot]=React.useState('');
  const pullingRef=React.useRef(false);
  const lastPullRef=React.useRef(0);
  const syncTimerRef=React.useRef(null);

  function flashSync(promise){setSyncDot('up');promise.then(res=>{clearTimeout(syncTimerRef.current);setSyncDot(res===null?'err':'ok');syncTimerRef.current=setTimeout(()=>setSyncDot(''),3000);}).catch(()=>setSyncDot('err'));}

  React.useEffect(()=>{
    const local=loadLocal();
    if(!local.backendUrl&&BACKEND==='YOUR_APPS_SCRIPT_URL_HERE'){setScreen('onboarding');return;}
    if(local.sessions?.length)setSessions(local.sessions.map(s=>({...s,date:normalizeDate(s.date)})));
    if(local.settings)setSettings(local.settings);
    setScreen('app');
  },[]);

  React.useEffect(()=>{
    if(screen!=='app')return;
    saveLocal({backendUrl:getBackendUrl(),sessions,settings});
  },[sessions,settings,screen]);

  async function doPull(force){
    if(pullingRef.current)return;
    const url=getBackendUrl();
    if(!url||url==='YOUR_APPS_SCRIPT_URL_HERE')return;
    const now=Date.now();
    if(!force&&now-lastPullRef.current<60000)return;
    pullingRef.current=true;lastPullRef.current=now;
    try{const res=await api({action:'get_all'});if(res?.ok){if(res.sessions?.length)setSessions(res.sessions.map(s=>({...s,date:normalizeDate(s.date)})));if(res.settings?.length){const s={};res.settings.forEach(r=>{s[r.key]=r.value;});setSettings(s);}}}catch(e){}
    setTimeout(()=>{pullingRef.current=false;},500);
  }

  React.useEffect(()=>{
    if(screen!=='app')return;
    doPull(true);
    function onVisible(){if(document.visibilityState==='visible')doPull(false);}
    document.addEventListener('visibilitychange',onVisible);
    return()=>document.removeEventListener('visibilitychange',onVisible);
  },[screen]);

  function handleOnboardingComplete(backendUrl,cloudData){
    saveLocal({backendUrl});
    if(cloudData?.sessions?.length)setSessions(cloudData.sessions.map(s=>({...s,date:normalizeDate(s.date)})));
    if(cloudData?.settings?.length){const s={};cloudData.settings.forEach(r=>{s[r.key]=r.value;});setSettings(s);}
    setScreen('app');
  }
  function saveSession(session){setSessions(prev=>[session,...prev.filter(s=>s.id!==session.id)]);flashSync(api({action:'save_session',...session}));}
  function deleteSession(id){setSessions(prev=>prev.filter(s=>s.id!==id));flashSync(api({action:'delete_session',id}));}
  function saveSetting(key,value){setSettings(prev=>({...prev,[key]:value}));flashSync(api({action:'save_setting',key,value}));}

  if(screen==='loading')return null;
  if(screen==='onboarding')return <OnboardingScreen onComplete={handleOnboardingComplete}/>;

  const syncColor=syncDot==='ok'?'#22c55e':syncDot==='err'?'#ef4444':'#93c5fd';
  const syncLabel={up:'↑',ok:'✓',err:'⚠'}[syncDot]||'';

  const tabs=[
    {k:'today',   icon:'🏋️', label:'Today'},
    {k:'history', icon:'📋', label:'History'},
    {k:'weight',  icon:'⚖️', label:'Weight'},
    {k:'settings',icon:'⚙',  label:'Settings'},
  ];

  return (
    <div style={{minHeight:'100vh',background:'#05080f',color:'#cbd5e1',fontFamily:'Georgia,serif'}}>
      <div style={{position:'fixed',top:0,left:0,right:0,zIndex:100,background:'#0a0f1a',borderBottom:'1px solid #1e293b',padding:'12px 16px',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
        <div style={{fontWeight:700,color:'#f1f5f9',fontSize:17}}>💪 Workout Tracker</div>
        {syncLabel&&<span style={{color:syncColor,fontSize:18,fontWeight:700}}>{syncLabel}</span>}
      </div>
      <div style={{paddingTop:52}}>
        {tab==='today'   &&<TodayTab   sessions={sessions} onSave={saveSession} settings={settings}/>}
        {tab==='history' &&<HistoryTab sessions={sessions} onDelete={deleteSession}/>}
        {tab==='weight'  &&<WeightTab/>}
        {tab==='settings'&&<SettingsTab settings={settings} onSaveSetting={saveSetting}/>}
      </div>
      <div style={{position:'fixed',bottom:0,left:0,right:0,background:'#0a0f1a',borderTop:'1px solid #1e293b',display:'flex',zIndex:200}}>
        {tabs.map(t=>(
          <button key={t.k} onClick={()=>setTab(t.k)} style={{flex:1,padding:'10px 4px 14px',background:'none',border:'none',borderTop:tab===t.k?'2px solid #3b82f6':'2px solid transparent',color:tab===t.k?'#93c5fd':'#475569',fontSize:11,cursor:'pointer',fontFamily:'Georgia,serif',fontWeight:tab===t.k?700:400,lineHeight:1.5}}>
            <div style={{fontSize:18}}>{t.icon}</div>
            {t.label}
          </button>
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
