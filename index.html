<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Workout Tracker</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; background: #05080f; }

</head>
<body>
  <div id="root"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <script type="text/babel">

// ─────────────────────────────────────────────────────────────────
// CONFIG — paste your deployed Apps Script URL here after setup
// ─────────────────────────────────────────────────────────────────
const BACKEND = "YOUR_APPS_SCRIPT_URL_HERE";
const STORAGE_KEY = "workout-tracker-v1";

// ─────────────────────────────────────────────────────────────────
// WORKOUT PLAN  (day 0 = Sunday ... 6 = Saturday)
// ─────────────────────────────────────────────────────────────────
const PLAN = {
  1: {
    name: 'Upper Body', emoji: '💪', type: 'strength',
    exercises: [
      { name: 'Push-Up',                  sets: 3, reps: 10, bodyweight: true },
      { name: 'Dumbbell Shoulder Press',  sets: 3, reps: 10, defaultWeight: 15 },

    tip: 'Breathe harder than normal but still able to talk. Move with purpose!'
  },
  3: {
    name: 'Lower Body', emoji: '🦵', type: 'strength',
    exercises: [
      { name: 'Squat',          sets: 3, reps: 12, bodyweight: true },
      { name: 'Reverse Lunge', sets: 3, reps: 10, bodyweight: true, perSide: true },

  },

    tip: 'Overhead 20s · Toe touch 20s · Hip flexor 20s each · Neck rolls'
  },
  5: {
    name: 'Full Body', emoji: '🔥', type: 'strength',
    exercises: [

// ─────────────────────────────────────────────────────────────────
// BACKEND / STORAGE HELPERS
// ─────────────────────────────────────────────────────────────────
function getBackendUrl() {
  const stored = loadLocal().backendUrl;
  return (stored && stored.includes('script.google.com')) ? stored : BACKEND;
}

function api(params) {
  const url = getBackendUrl();
  if (!url || !url.includes('script.google.com')) return Promise.resolve(null);
  return new Promise((resolve) => {
    const cb = 'cb_' + Math.random().toString(36).slice(2);
    const qs = Object.entries({ ...params, callback: cb })
      .map(([k, v]) => `${encodeURIComponent(k)}=${encodeURIComponent(String(v))}`)
      .join('&');
    const s = document.createElement('script');
    const t = setTimeout(() => { delete window[cb]; s.remove(); resolve(null); }, 12000);
    window[cb] = (d) => { clearTimeout(t); delete window[cb]; s.remove(); resolve(d); };
    s.onerror = () => { clearTimeout(t); delete window[cb]; s.remove(); resolve(null); };
    s.src = `${url}?${qs}`;
    document.head.appendChild(s);
  });
}

function loadLocal() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch(e) { return {}; }
}
function saveLocal(data) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch(e) {}
}

// ─────────────────────────────────────────────────────────────────
// DATE HELPERS
// ─────────────────────────────────────────────────────────────────
function normalizeDate(d) { if (!d) return d; return String(d).slice(0, 10); }
function todayStr() {
  const n = new Date();
  return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`;
}
function daysBetween(d1, d2) {
  return Math.round(
    (new Date(normalizeDate(d2) + 'T12:00:00') - new Date(normalizeDate(d1) + 'T12:00:00'))
    / 86400000
  );
}
function todayDayOfWeek() { return new Date().getDay(); }
function formatTime(sec) {
  const m = Math.floor(sec / 60), s = sec % 60;
  return m > 0 ? `${m}m ${s}s` : `${s}s`;
}
function getDayLabel(dateStr) {
  const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const d = new Date(normalizeDate(dateStr) + 'T12:00:00');
  return `${days[d.getDay()]} ${months[d.getMonth()]} ${d.getDate()}`;
}

// ─────────────────────────────────────────────────────────────────
// INITIALIZE LOG STATE FROM PLAN
// ─────────────────────────────────────────────────────────────────
function makeLogState(plan, existingSession) {
  if (plan.type === 'strength') {
    let existing = null;
    if (existingSession?.exercises_json) {
      try { existing = JSON.parse(existingSession.exercises_json); } catch(e) {}
    }
    return {
      exercises: plan.exercises.map((ex, i) => {
        if (existing && existing[i]) return existing[i];
        const sets = [];
        for (let s = 0; s < ex.sets; s++) {
          if (ex.isPlank) sets.push({ time: 0, done: false });
          else sets.push({ reps: ex.reps, weight: ex.bodyweight ? 0 : (ex.defaultWeight || 15), done: false });
        }
        return {
          name: ex.name,
          type: ex.isPlank ? 'plank' : 'strength',
          bodyweight: !!ex.bodyweight,
          perSide: !!ex.perSide,
          sets,
        };
      }),
      duration: existingSession?.duration_min || '',
      notes: existingSession?.notes || '',
    };
  } else {
    return {
      duration: existingSession?.duration_min || (plan.duration ? String(plan.duration) : ''),
      notes: existingSession?.notes || '',
    };
  }
}

// ─────────────────────────────────────────────────────────────────
// ONBOARDING SCREEN
// ─────────────────────────────────────────────────────────────────
function OnboardingScreen({ onComplete }) {
  const [mode, setMode] = React.useState('choice');
  const [url, setUrl] = React.useState('');
  const [status, setStatus] = React.useState('');

  async function handleRestore() {
    if (!url.includes('script.google.com')) { setStatus('Paste the full /exec URL'); return; }
    setStatus('Connecting...');
    saveLocal({ backendUrl: url });
    const res = await api({ action: 'get_all' });
    if (!res?.ok) { setStatus('Could not reach that URL — check deployment settings.'); return; }
    onComplete(url, res);
  }

  const page = { minHeight:'100vh', background:'#05080f', color:'#cbd5e1', fontFamily:'Georgia,serif',
    display:'flex', alignItems:'center', justifyContent:'center', padding:24 };
  const bigBtn = (col) => ({
    display:'block', width:'100%', padding:'15px', fontFamily:'Georgia,serif', fontSize:16,
    background: col === 'blue' ? '#1e3a5f' : '#1c2a1c',
    border: `1px solid ${col === 'blue' ? '#3b82f6' : '#166534'}`,
    borderRadius:10, color: col === 'blue' ? '#93c5fd' : '#4ade80',
    cursor:'pointer', marginBottom:12,
  });

  return (
    <div style={page}>
      {mode === 'choice' ? (
        <div style={{textAlign:'center', maxWidth:340, width:'100%'}}>
          <div style={{fontSize:48, marginBottom:12}}>🏋️</div>
          <div style={{fontSize:22, fontWeight:700, color:'#f1f5f9', marginBottom:6}}>Workout Tracker</div>
          <div style={{color:'#64748b', fontSize:14, marginBottom:32}}>
            Home training log · Wegovy plan
          </div>
          <button onClick={() => onComplete(BACKEND, null)} style={bigBtn('blue')}>
            Start fresh
          </button>
          <button onClick={() => setMode('restore')} style={bigBtn('green')}>
            Restore from cloud (other device)
          </button>
        </div>
      ) : (
        <div style={{maxWidth:360, width:'100%'}}>
          <div style={{fontSize:16, fontWeight:700, color:'#f1f5f9', marginBottom:8}}>Paste your Apps Script URL</div>
          <div style={{color:'#64748b', fontSize:13, marginBottom:12}}>
            Copy it from Settings on the device that has your data.
          </div>
          <input value={url} onChange={e => setUrl(e.target.value)}
            placeholder="https://script.google.com/macros/s/.../exec"
            style={{width:'100%', padding:'10px 12px', background:'#0f172a', border:'1px solid #1e3a5f',
              borderRadius:8, color:'#f1f5f9', fontSize:12, marginBottom:12}} />
          {status && <div style={{fontSize:13, marginBottom:8,
            color: status.startsWith('Could') ? '#ef4444' : '#94a3b8'}}>{status}</div>}
          <button onClick={handleRestore} style={bigBtn('blue')}>Connect & Restore</button>
          <button onClick={() => setMode('choice')}
            style={{width:'100%', padding:'10px', background:'none', border:'1px solid #1e293b',
              borderRadius:8, color:'#475569', fontSize:14, cursor:'pointer', fontFamily:'Georgia,serif'}}>
            Back
          </button>
        </div>
      )}
    </div>
  );
}

// ─────────────────────────────────────────────────────────────────
// PLANK TIMER COMPONENT
// ─────────────────────────────────────────────────────────────────
function PlankTimer({ onDone }) {
  const [running, setRunning] = React.useState(false);
  const [elapsed, setElapsed] = React.useState(0);
  const startRef = React.useRef(null);
  const timerRef = React.useRef(null);

  function start() {
    startRef.current = Date.now() - elapsed * 1000;
    setRunning(true);
    timerRef.current = setInterval(() => {
      setElapsed(Math.floor((Date.now() - startRef.current) / 1000));
    }, 100);
  }
  function pause() {
    clearInterval(timerRef.current);
    setRunning(false);
  }
  function finish() {
    clearInterval(timerRef.current);
    setRunning(false);
    onDone(elapsed);
  }
  React.useEffect(() => () => clearInterval(timerRef.current), []);

  return (
    <div style={{background:'#060c18', border:'1px solid #1e3a5f', borderRadius:10, padding:14, marginTop:8}}>
      <div style={{fontSize:36, fontWeight:700, color:'#22d3ee', textAlign:'center', marginBottom:12, letterSpacing:2}}>
        {formatTime(elapsed)}
      </div>
      <div style={{display:'flex', gap:8}}>
        {!running ? (
          <button onClick={start}
            style={{flex:1, padding:'12px', background:'#1e3a5f', border:'1px solid #3b82f6',
              borderRadius:8, color:'#93c5fd', cursor:'pointer', fontFamily:'Georgia,serif', fontSize:15}}>
            {elapsed > 0 ? '▶ Resume' : '▶ Start'}
          </button>
        ) : (
          <button onClick={pause}
            style={{flex:1, padding:'12px', background:'#2d1f00', border:'1px solid #f97316',
              borderRadius:8, color:'#fdba74', cursor:'pointer', fontFamily:'Georgia,serif', fontSize:15}}>
            ⏸ Pause
          </button>
        )}
        {elapsed > 0 && (
          <button onClick={finish}
            style={{flex:1, padding:'12px', background:'#1c2a1c', border:'1px solid #166534',
              borderRadius:8, color:'#4ade80', cursor:'pointer', fontFamily:'Georgia,serif', fontSize:15}}>
            ✓ Done
          </button>
        )}
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────────
// TODAY TAB
// ─────────────────────────────────────────────────────────────────
function TodayTab({ sessions, onSave, settings }) {
  const today = todayStr();
  const dow = todayDayOfWeek();
  const plan = PLAN[dow];
  const existingSession = sessions.find(s => normalizeDate(s.date) === today);
  const isDone = existingSession?.done === 'true' || existingSession?.done === true;

  const [logState, setLogState] = React.useState(() => makeLogState(plan, existingSession));
  const [saved, setSaved] = React.useState(isDone);
  const [openTimerKey, setOpenTimerKey] = React.useState(null); // e.g. "2-1" = ex 2, set 1

  // Progression banner: show on week 2, 4, 6, ... of training
  const startDate = settings?.startDate;
  const weeksIn = startDate ? Math.floor(daysBetween(startDate, today) / 7) + 1 : null;
  const showProgressionBanner = weeksIn && weeksIn >= 2 && weeksIn % 2 === 0;

  const dayNames = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

  function updateSetField(exIdx, setIdx, field, value) {
    setLogState(prev => ({
      ...prev,
      exercises: prev.exercises.map((ex, ei) =>
        ei !== exIdx ? ex : {
          ...ex,
          sets: ex.sets.map((set, si) => si !== setIdx ? set : { ...set, [field]: value })
        }
      )
    }));
  }

  function setWeightAllSets(exIdx, weight) {
    setLogState(prev => ({
      ...prev,
      exercises: prev.exercises.map((ex, ei) =>
        ei !== exIdx ? ex : {
          ...ex,
          sets: ex.sets.map(set => ({ ...set, weight }))
        }
      )
    }));
  }

  function toggleSetDone(exIdx, setIdx) {
    setLogState(prev => ({
      ...prev,
      exercises: prev.exercises.map((ex, ei) =>
        ei !== exIdx ? ex : {
          ...ex,
          sets: ex.sets.map((set, si) => si !== setIdx ? set : { ...set, done: !set.done })
        }
      )
    }));
  }

  function handlePlankDone(exIdx, setIdx, time) {
    setLogState(prev => ({
      ...prev,
      exercises: prev.exercises.map((ex, ei) =>
        ei !== exIdx ? ex : {
          ...ex,
          sets: ex.sets.map((set, si) => si !== setIdx ? set : { ...set, time, done: true })
        }
      )
    }));
    setOpenTimerKey(null);
  }

  function handleSave(done) {
    const id = existingSession?.id || (Date.now() + '-' + Math.random().toString(36).slice(2, 7));
    const session = {
      id,
      date: today,
      day_type: `${plan.emoji} ${plan.name}`,
      exercises_json: plan.type === 'strength' ? JSON.stringify(logState.exercises) : '[]',
      duration_min: logState.duration || '',
      notes: logState.notes || '',
      done: done ? 'true' : 'false',
    };
    onSave(session);
    if (done) setSaved(true);
  }

  // Shared styles
  const card = { background:'#0f172a', border:'1px solid #1e293b', borderRadius:12, padding:14, marginBottom:12 };
  const label = { fontSize:12, color:'#64748b', marginBottom:4 };
  const numInput = {
    padding:'8px', background:'#0a0f1a', border:'1px solid #1e3a5f',
    borderRadius:6, color:'#f1f5f9', fontSize:16, textAlign:'center', width:'100%'
  };
  const finishBtn = {
    width:'100%', padding:'16px', background:'#1e3a5f', border:'1px solid #3b82f6',
    borderRadius:10, color:'#93c5fd', cursor:'pointer', fontFamily:'Georgia,serif', fontSize:17, marginBottom:8
  };

  // ── COMPLETED VIEW ──
  if (saved && existingSession) {
    let exercises = [];
    try { exercises = JSON.parse(existingSession.exercises_json || '[]'); } catch(e) {}
    return (
      <div style={{padding:'16px 16px 90px'}}>
        {showProgressionBanner && (
          <div style={{background:'#0f2a0f', border:'1px solid #166534', borderRadius:10, padding:12, marginBottom:12}}>
            <div style={{color:'#4ade80', fontWeight:700, marginBottom:2}}>🎯 Progression Week!</div>
            <div style={{color:'#86efac', fontSize:13}}>You're on week {weeksIn}. Time to add 5 lbs to each dumbbell exercise (or 1 extra rep)!</div>
          </div>
        )}
        <div style={{...card, border:'1px solid #166534', textAlign:'center', padding:20}}>
          <div style={{fontSize:40, marginBottom:6}}>{plan.emoji}</div>
          <div style={{color:'#4ade80', fontWeight:700, fontSize:20}}>✓ {plan.name} Complete!</div>
          <div style={{color:'#475569', fontSize:13, marginTop:4}}>{dayNames[dow]}</div>
          {existingSession.duration_min && (
            <div style={{color:'#64748b', fontSize:13, marginTop:4}}>Duration: {existingSession.duration_min} min</div>
          )}
        </div>
        {exercises.length > 0 && (
          <div style={card}>
            {exercises.map((ex, i) => (
              <div key={i} style={{marginBottom: i < exercises.length - 1 ? 12 : 0}}>
                <div style={{color:'#94a3b8', fontWeight:700, fontSize:14, marginBottom:6}}>
                  {ex.name}{ex.perSide ? <span style={{color:'#475569', fontSize:11, fontWeight:400}}> · each side</span> : ''}
                </div>
                {ex.sets.map((set, j) => (
                  <div key={j} style={{display:'flex', gap:8, marginBottom:4, alignItems:'center'}}>
                    <span style={{color:'#475569', fontSize:12, minWidth:44}}>Set {j+1}</span>
                    {ex.type === 'plank'
                      ? <span style={{color:'#22d3ee', fontSize:14}}>{set.done ? formatTime(set.time) : '—'}</span>
                      : <span style={{color: set.done ? '#f1f5f9' : '#475569', fontSize:14}}>
                          {ex.bodyweight ? '' : `${set.weight} lbs × `}{set.reps} reps{set.done ? ' ✓' : ''}
                        </span>
                    }
                  </div>
                ))}
                {i < exercises.length - 1 && <div style={{borderBottom:'1px solid #1e293b', margin:'10px 0'}}/>}
              </div>
            ))}
          </div>
        )}
        {existingSession.notes ? (
          <div style={{color:'#64748b', fontSize:13, fontStyle:'italic', marginBottom:12, padding:'0 4px'}}>
            "{existingSession.notes}"
          </div>
        ) : null}
        <button onClick={() => setSaved(false)}
          style={{width:'100%', padding:'12px', background:'none', border:'1px solid #1e293b',
            borderRadius:8, color:'#475569', cursor:'pointer', fontFamily:'Georgia,serif', fontSize:14}}>
          Edit Workout
        </button>
      </div>
    );
  }

  // ── REST DAY ──
  if (plan.type === 'rest') {
    return (
      <div style={{padding:'16px 16px 90px'}}>
        <div style={{...card, textAlign:'center', padding:28}}>
          <div style={{fontSize:48, marginBottom:10}}>{plan.emoji}</div>
          <div style={{color:'#f1f5f9', fontWeight:700, fontSize:20, marginBottom:10}}>{plan.name}</div>
          {plan.tip && <div style={{color:'#64748b', fontSize:14, lineHeight:1.6}}>{plan.tip}</div>}
        </div>
        <button onClick={() => handleSave(true)} style={finishBtn}>
          Mark Complete ✓
        </button>
      </div>
    );
  }

  // ── CARDIO DAY ──
  if (plan.type === 'cardio') {
    return (
      <div style={{padding:'16px 16px 90px'}}>
        <div style={{...card, textAlign:'center', padding:24}}>
          <div style={{fontSize:44, marginBottom:8}}>{plan.emoji}</div>
          <div style={{color:'#f1f5f9', fontWeight:700, fontSize:20}}>{plan.name}</div>
          <div style={{color:'#475569', fontSize:13, marginTop:4}}>Target: {plan.duration} min</div>
          {plan.tip && <div style={{color:'#64748b', fontSize:13, marginTop:8, lineHeight:1.5}}>{plan.tip}</div>}
        </div>
        <div style={card}>
          <div style={label}>Actual Duration (minutes)</div>
          <input type="number" value={logState.duration}
            onChange={e => setLogState(prev => ({...prev, duration: e.target.value}))}
            style={numInput} placeholder={String(plan.duration)} />
        </div>
        <div style={card}>
          <div style={label}>Notes (optional)</div>
          <textarea value={logState.notes}
            onChange={e => setLogState(prev => ({...prev, notes: e.target.value}))}
            placeholder="How did it feel?"
            style={{width:'100%', padding:'8px', background:'#0a0f1a', border:'1px solid #1e293b',
              borderRadius:6, color:'#f1f5f9', fontSize:14, minHeight:64, fontFamily:'Georgia,serif'}} />
        </div>
        <button onClick={() => handleSave(true)} style={finishBtn}>
          Finish Workout ✓
        </button>
      </div>
    );
  }

  // ── STRENGTH DAY ──
  return (
    <div style={{padding:'16px 16px 100px'}}>
      {showProgressionBanner && (
        <div style={{background:'#0f2a0f', border:'1px solid #166534', borderRadius:10, padding:12, marginBottom:12}}>
          <div style={{color:'#4ade80', fontWeight:700, marginBottom:2}}>🎯 Progression Week!</div>
          <div style={{color:'#86efac', fontSize:13}}>Week {weeksIn}: Add 5 lbs to each exercise (or 1 extra rep).</div>
        </div>
      )}

      {/* Day header */}
      <div style={{background:'#0a0f1a', border:'1px solid #1e293b', borderRadius:10,
        padding:'10px 14px', marginBottom:12, display:'flex', alignItems:'center', gap:12}}>
        <span style={{fontSize:26}}>{plan.emoji}</span>
        <div>
          <div style={{color:'#f1f5f9', fontWeight:700, fontSize:16}}>{plan.name}</div>
          <div style={{color:'#64748b', fontSize:12}}>{dayNames[dow]}</div>
        </div>
      </div>

      {/* Exercise cards */}
      {logState.exercises.map((ex, exIdx) => (
        <div key={exIdx} style={card}>
          {/* Exercise header */}
          <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:10}}>
            <div style={{color:'#f1f5f9', fontWeight:700, fontSize:15}}>{ex.name}</div>
            {ex.perSide && (
              <span style={{fontSize:11, color:'#64748b', background:'#1e293b', padding:'2px 8px', borderRadius:10}}>
                each side
              </span>
            )}
          </div>

          {/* Plank sets */}
          {ex.type === 'plank' && (
            <div>
              {ex.sets.map((set, setIdx) => {
                const timerKey = `${exIdx}-${setIdx}`;
                return (
                  <div key={setIdx} style={{marginBottom:8}}>
                    <div style={{display:'flex', alignItems:'center', gap:10}}>
                      <span style={{color:'#64748b', fontSize:13, minWidth:44}}>Set {setIdx+1}</span>
                      {set.done ? (
                        <>
                          <span style={{color:'#22d3ee', fontSize:15, flex:1}}>✓ {formatTime(set.time)}</span>
                          <button onClick={() => {
                            updateSetField(exIdx, setIdx, 'done', false);
                            updateSetField(exIdx, setIdx, 'time', 0);
                          }} style={{padding:'5px 10px', background:'none', border:'1px solid #1e293b',
                            borderRadius:6, color:'#475569', cursor:'pointer', fontSize:12}}>
                            undo
                          </button>
                        </>
                      ) : (
                        <button
                          onClick={() => setOpenTimerKey(openTimerKey === timerKey ? null : timerKey)}
                          style={{flex:1, padding:'9px', background: openTimerKey === timerKey ? '#1a1a2e' : '#0a0f1a',
                            border:`1px solid ${openTimerKey === timerKey ? '#3b82f6' : '#1e3a5f'}`,
                            borderRadius:6, color:'#93c5fd', cursor:'pointer', fontFamily:'Georgia,serif', fontSize:13}}>
                          {openTimerKey === timerKey ? '▲ Close Timer' : '⏱ Open Timer'}
                        </button>
                      )}
                    </div>
                    {openTimerKey === timerKey && (
                      <PlankTimer onDone={(t) => handlePlankDone(exIdx, setIdx, t)} />
                    )}
                  </div>
                );
              })}
            </div>
          )}

          {/* Strength sets */}
          {ex.type === 'strength' && (
            <div>
              {/* Weight input (shared across all sets) */}
              {!ex.bodyweight && (
                <div style={{display:'flex', alignItems:'center', gap:10, marginBottom:10}}>
                  <span style={{color:'#64748b', fontSize:13, minWidth:44}}>Weight</span>
                  <div style={{flex:1, position:'relative'}}>
                    <input type="number" value={ex.sets[0]?.weight ?? 0}
                      onChange={e => setWeightAllSets(exIdx, Number(e.target.value))}
                      style={{...numInput, paddingRight:36}} />
                    <span style={{position:'absolute', right:10, top:'50%', transform:'translateY(-50%)',
                      color:'#475569', fontSize:12, pointerEvents:'none'}}>lbs</span>
                  </div>
                </div>
              )}
              {ex.bodyweight && (
                <div style={{color:'#475569', fontSize:12, marginBottom:10}}>Bodyweight</div>
              )}

              {/* Set rows */}
              {ex.sets.map((set, setIdx) => (
                <div key={setIdx} style={{display:'flex', alignItems:'center', gap:8, marginBottom:8}}>
                  <span style={{color:'#64748b', fontSize:13, minWidth:44}}>Set {setIdx+1}</span>
                  <input type="number" value={set.reps}
                    onChange={e => updateSetField(exIdx, setIdx, 'reps', Number(e.target.value))}
                    style={{width:58, padding:'8px', background:'#0a0f1a',
                      border:`1px solid ${set.done ? '#166534' : '#1e3a5f'}`,
                      borderRadius:6, color:'#f1f5f9', fontSize:16, textAlign:'center'}} />
                  <span style={{color:'#475569', fontSize:12}}>reps</span>
                  <div style={{flex:1}} />
                  <button onClick={() => toggleSetDone(exIdx, setIdx)}
                    style={{width:44, height:44, background: set.done ? '#1c2a1c' : '#0f172a',
                      border:`1px solid ${set.done ? '#166534' : '#1e293b'}`,
                      borderRadius:8, color: set.done ? '#4ade80' : '#475569',
                      cursor:'pointer', fontSize:20, display:'flex', alignItems:'center', justifyContent:'center'}}>
                    {set.done ? '✓' : '○'}
                  </button>
                </div>
              ))}
            </div>
          )}
        </div>
      ))}

      {/* Duration */}
      <div style={card}>
        <div style={label}>Total Duration (min, optional)</div>
        <input type="number" value={logState.duration}
          onChange={e => setLogState(prev => ({...prev, duration: e.target.value}))}
          style={numInput} placeholder="e.g. 35" />
      </div>

      {/* Save buttons */}
      <button onClick={() => handleSave(true)} style={finishBtn}>
        Finish Workout ✓
      </button>
      <button onClick={() => handleSave(false)}
        style={{width:'100%', padding:'11px', background:'none', border:'1px solid #1e293b',
          borderRadius:8, color:'#475569', cursor:'pointer', fontFamily:'Georgia,serif', fontSize:13}}>
        Save Progress (come back later)
      </button>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────────
// HISTORY TAB
// ─────────────────────────────────────────────────────────────────
function HistoryTab({ sessions, onDelete }) {
  const [expanded, setExpanded] = React.useState(null);

  const sorted = [...sessions]
    .sort((a, b) => normalizeDate(b.date) > normalizeDate(a.date) ? 1 : -1);

  if (sorted.length === 0) {
    return (
      <div style={{padding:32, textAlign:'center', color:'#475569'}}>
        <div style={{fontSize:40, marginBottom:12}}>📋</div>
        <div style={{color:'#94a3b8', fontSize:16, marginBottom:6}}>No workouts logged yet</div>
        <div style={{fontSize:13}}>Complete today's workout to see history here.</div>
      </div>
    );
  }

  return (
    <div style={{padding:'16px 16px 90px'}}>
      {/* Summary strip */}
      <div style={{display:'flex', gap:8, marginBottom:16}}>
        {[
          { label: 'Total', value: sorted.length },
          { label: 'Done', value: sorted.filter(s => s.done === 'true' || s.done === true).length },
          { label: 'This week', value: sorted.filter(s => daysBetween(s.date, todayStr()) <= 7).length },
        ].map(item => (
          <div key={item.label} style={{flex:1, background:'#0f172a', border:'1px solid #1e293b',
            borderRadius:10, padding:'10px 4px', textAlign:'center'}}>
            <div style={{color:'#f1f5f9', fontWeight:700, fontSize:20}}>{item.value}</div>
            <div style={{color:'#475569', fontSize:11}}>{item.label}</div>
          </div>
        ))}
      </div>

      {sorted.map(session => {
        let exercises = [];
        try { exercises = JSON.parse(session.exercises_json || '[]'); } catch(e) {}
        const isExpanded = expanded === session.id;
        const isDone = session.done === 'true' || session.done === true;

        return (
          <div key={session.id} style={{
            background:'#0f172a',
            border:`1px solid ${isDone ? '#1e3a5f' : '#2a1a00'}`,
            borderRadius:12, marginBottom:10, overflow:'hidden'
          }}>
            <button onClick={() => setExpanded(isExpanded ? null : session.id)}
              style={{width:'100%', padding:'12px 14px', background:'none', border:'none',
                display:'flex', alignItems:'center', gap:10, cursor:'pointer', textAlign:'left'}}>
              <div style={{flex:1}}>
                <div style={{color:'#f1f5f9', fontWeight:700, fontSize:15}}>{session.day_type}</div>
                <div style={{color:'#64748b', fontSize:12, marginTop:2}}>{getDayLabel(session.date)}</div>
              </div>
              <div style={{display:'flex', alignItems:'center', gap:8}}>
                {isDone && <span style={{color:'#4ade80', fontSize:14}}>✓</span>}
                {session.duration_min ? (
                  <span style={{color:'#64748b', fontSize:12}}>{session.duration_min}m</span>
                ) : null}
                <span style={{color:'#475569', fontSize:16}}>{isExpanded ? '▲' : '▽'}</span>
              </div>
            </button>

            {isExpanded && (
              <div style={{padding:'4px 14px 14px', borderTop:'1px solid #1e293b'}}>
                {exercises.map((ex, i) => (
                  <div key={i} style={{marginTop:10}}>
                    <div style={{color:'#94a3b8', fontSize:13, fontWeight:700, marginBottom:4}}>
                      {ex.name}
                      {ex.perSide ? <span style={{color:'#475569', fontWeight:400}}> · each side</span> : ''}
                    </div>
                    {ex.sets.map((set, j) => (
                      <div key={j} style={{display:'flex', gap:8, fontSize:13, color:'#64748b', marginBottom:3}}>
                        <span style={{minWidth:44}}>Set {j+1}</span>
                        {ex.type === 'plank'
                          ? <span style={{color: set.done ? '#22d3ee' : '#475569'}}>
                              {set.done && set.time > 0 ? formatTime(set.time) : 'not recorded'}
                            </span>
                          : <span style={{color: set.done ? '#f1f5f9' : '#475569'}}>
                              {ex.bodyweight ? '' : `${set.weight} lbs × `}{set.reps} reps
                              {set.done ? ' ✓' : ''}
                            </span>
                        }
                      </div>
                    ))}
                  </div>
                ))}
                {session.notes ? (
                  <div style={{marginTop:10, color:'#64748b', fontSize:13, fontStyle:'italic'}}>
                    "{session.notes}"
                  </div>
                ) : null}
                <button
                  onClick={() => { if (window.confirm('Delete this session?')) onDelete(session.id); }}
                  style={{marginTop:12, padding:'7px 14px', background:'none', border:'1px solid #3f1515',
                    borderRadius:6, color:'#ef4444', cursor:'pointer', fontSize:12, fontFamily:'Georgia,serif'}}>
                  Delete session
                </button>
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

// ─────────────────────────────────────────────────────────────────
// SETTINGS TAB
// ─────────────────────────────────────────────────────────────────
function SettingsTab({ settings, onSaveSetting }) {
  const [urlInput, setUrlInput] = React.useState(loadLocal().backendUrl || BACKEND);
  const [testStatus, setTestStatus] = React.useState('');
  const [startDate, setStartDate] = React.useState(settings?.startDate || '');

  async function testUrl() {
    setTestStatus('Testing...');
    const prev = loadLocal();
    saveLocal({ ...prev, backendUrl: urlInput });
    const res = await api({ action: 'get_all' });
    setTestStatus(res?.ok ? '✓ Connected!' : '✗ Could not reach — check deployment settings');
  }
  function saveUrl() {
    const prev = loadLocal();
    saveLocal({ ...prev, backendUrl: urlInput });
    setTestStatus('Saved.');
  }
  function saveStartDate() {
    onSaveSetting('startDate', startDate);
  }

  const card = { background:'#0f172a', border:'1px solid #1e293b', borderRadius:12, padding:16, marginBottom:12 };
  const h = { fontSize:14, color:'#94a3b8', fontWeight:700, marginBottom:8 };
  const sub = { color:'#64748b', fontSize:13, marginBottom:8, lineHeight:1.5 };
  const inp = { width:'100%', padding:'10px 12px', background:'#0a0f1a', border:'1px solid #1e293b',
    borderRadius:8, color:'#f1f5f9', fontSize:13, marginBottom:8 };
  const btn = (col) => ({
    padding:'9px 18px', fontFamily:'Georgia,serif', fontSize:13, cursor:'pointer',
    background: col === 'blue' ? '#1e3a5f' : 'none',
    border: `1px solid ${col === 'blue' ? '#3b82f6' : '#1e293b'}`,
    borderRadius:8, color: col === 'blue' ? '#93c5fd' : '#94a3b8',
  });

  return (
    <div style={{padding:'16px 16px 90px'}}>
      {/* Progression start date */}
      <div style={card}>
        <div style={h}>Training Start Date</div>
        <div style={sub}>Set this to track your 2-week progression cycles (when to add weight).</div>
        <input type="date" value={startDate} onChange={e => setStartDate(e.target.value)} style={inp} />
        <button onClick={saveStartDate} style={btn('blue')}>Save Date</button>
      </div>

      {/* Cloud sync */}
      <div style={card}>
        <div style={h}>Cloud Sync (Google Sheets)</div>
        <div style={sub}>
          Paste your Apps Script /exec URL to back up your data and sync across devices.
          Share this URL with another device to restore your data there.
        </div>
        <input value={urlInput} onChange={e => setUrlInput(e.target.value)}
          placeholder="https://script.google.com/macros/s/.../exec"
          style={{...inp, fontSize:11}} />
        <div style={{display:'flex', gap:8, marginBottom:8}}>
          <button onClick={testUrl} style={btn('grey')}>Test</button>
          <button onClick={saveUrl} style={btn('blue')}>Save URL</button>
        </div>
        {testStatus && (
          <div style={{fontSize:13, color: testStatus.startsWith('✓') || testStatus === 'Saved.' ? '#22c55e' : '#ef4444'}}>
            {testStatus}
          </div>
        )}
      </div>

      {/* Plan reference */}
      <div style={card}>
        <div style={h}>Your 7-Day Plan</div>
        {[
          ['Mon', '💪', 'Upper Body — Push-Up, Shoulder Press, Row (3×10)'],
          ['Tue', '🚶', 'Brisk Walk — 30 min'],
          ['Wed', '🦵', 'Lower Body — Squat, Lunge, Glute Bridge (3×12/10/15)'],
          ['Thu', '🧘', 'Rest & Stretch'],
          ['Fri', '🔥', 'Full Body — Deadlift, Curl, Plank (3×10/12/max)'],
          ['Sat', '🌤️', 'Easy Walk/Bike — 40 min'],
          ['Sun', '😴', 'Full Rest'],
        ].map(([day, em, desc]) => (
          <div key={day} style={{display:'flex', gap:10, marginBottom:8, alignItems:'flex-start'}}>
            <span style={{color:'#475569', fontSize:12, minWidth:28, paddingTop:1}}>{day}</span>
            <span style={{fontSize:14, minWidth:20}}>{em}</span>
            <span style={{color:'#94a3b8', fontSize:13, lineHeight:1.4}}>{desc}</span>
          </div>
        ))}
        <div style={{marginTop:10, padding:'10px 12px', background:'#0a0f1a', border:'1px solid #1e293b',
          borderRadius:8, color:'#64748b', fontSize:12, lineHeight:1.5}}>
          📈 Every 2 weeks: add 5 lbs to dumbbell exercises (or 1 extra rep)
        </div>
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────────
// ROOT APP
// ─────────────────────────────────────────────────────────────────
function App() {
  const [screen, setScreen]   = React.useState('loading');
  const [tab, setTab]         = React.useState('today');
  const [sessions, setSessions] = React.useState([]);
  const [settings, setSettings] = React.useState({});
  const [syncDot, setSyncDot] = React.useState('');
  const pullingRef    = React.useRef(false);
  const lastPullRef   = React.useRef(0);
  const syncTimerRef  = React.useRef(null);

  function flashSync(promise) {
    setSyncDot('up');
    promise.then(res => {
      clearTimeout(syncTimerRef.current);
      setSyncDot(res === null ? 'err' : 'ok');
      syncTimerRef.current = setTimeout(() => setSyncDot(''), 3000);
    }).catch(() => setSyncDot('err'));
  }

  // Boot
  React.useEffect(() => {
    const local = loadLocal();
    if (!local.backendUrl && BACKEND === 'YOUR_APPS_SCRIPT_URL_HERE') {
      setScreen('onboarding'); return;
    }
    if (local.sessions?.length) setSessions(local.sessions.map(s => ({...s, date: normalizeDate(s.date)})));
    if (local.settings) setSettings(local.settings);
    setScreen('app');
  }, []);

  // Persist to localStorage
  React.useEffect(() => {
    if (screen !== 'app') return;
    saveLocal({ backendUrl: getBackendUrl(), sessions, settings });
  }, [sessions, settings, screen]);

  // Pull from Sheets
  async function doPull(force) {
    if (pullingRef.current) return;
    const url = getBackendUrl();
    if (!url || url === 'YOUR_APPS_SCRIPT_URL_HERE') return;
    const now = Date.now();
    if (!force && now - lastPullRef.current < 60000) return;
    pullingRef.current = true; lastPullRef.current = now;
    try {
      const res = await api({ action: 'get_all' });
      if (res?.ok) {
        if (res.sessions?.length) setSessions(res.sessions.map(s => ({...s, date: normalizeDate(s.date)})));
        if (res.settings?.length) {
          const s = {};
          res.settings.forEach(r => { s[r.key] = r.value; });
          setSettings(s);
        }
      }
    } catch(e) {}
    setTimeout(() => { pullingRef.current = false; }, 500);
  }

  React.useEffect(() => {
    if (screen !== 'app') return;
    doPull(true);
    function onVisible() { if (document.visibilityState === 'visible') doPull(false); }
    document.addEventListener('visibilitychange', onVisible);
    return () => document.removeEventListener('visibilitychange', onVisible);
  }, [screen]);

  function handleOnboardingComplete(backendUrl, cloudData) {
    saveLocal({ backendUrl });
    if (cloudData?.sessions?.length) setSessions(cloudData.sessions.map(s => ({...s, date: normalizeDate(s.date)})));
    if (cloudData?.settings?.length) {
      const s = {};
      cloudData.settings.forEach(r => { s[r.key] = r.value; });
      setSettings(s);
    }
    setScreen('app');
  }

  function saveSession(session) {
    setSessions(prev => [session, ...prev.filter(s => s.id !== session.id)]);
    flashSync(api({ action: 'save_session', ...session }));
  }
  function deleteSession(id) {
    setSessions(prev => prev.filter(s => s.id !== id));
    flashSync(api({ action: 'delete_session', id }));
  }
  function saveSetting(key, value) {
    setSettings(prev => ({ ...prev, [key]: value }));
    flashSync(api({ action: 'save_setting', key, value }));
  }

  if (screen === 'loading') return null;
  if (screen === 'onboarding') return <OnboardingScreen onComplete={handleOnboardingComplete} />;

  const syncColor = syncDot === 'ok' ? '#22c55e' : syncDot === 'err' ? '#ef4444' : '#93c5fd';
  const syncLabel = { up: '↑', ok: '✓', err: '⚠' }[syncDot] || '';

  const tabs = [
    { k: 'today',   icon: '🏋️', label: 'Today'   },
    { k: 'history', icon: '📋', label: 'History'  },
    { k: 'settings',icon: '⚙',  label: 'Settings' },
  ];

  return (
    <div style={{minHeight:'100vh', background:'#05080f', color:'#cbd5e1', fontFamily:'Georgia,serif'}}>
      {/* Fixed header */}
      <div style={{position:'fixed', top:0, left:0, right:0, zIndex:100,
        background:'#0a0f1a', borderBottom:'1px solid #1e293b',
        padding:'12px 16px', display:'flex', alignItems:'center', justifyContent:'space-between'}}>
        <div style={{fontWeight:700, color:'#f1f5f9', fontSize:17}}>💪 Workout Tracker</div>
        {syncLabel && <span style={{color:syncColor, fontSize:18, fontWeight:700}}>{syncLabel}</span>}
      </div>

      {/* Page content */}
      <div style={{paddingTop:52}}>
        {tab === 'today'    && <TodayTab   sessions={sessions} onSave={saveSession} settings={settings} />}
        {tab === 'history'  && <HistoryTab sessions={sessions} onDelete={deleteSession} />}
        {tab === 'settings' && <SettingsTab settings={settings} onSaveSetting={saveSetting} />}
      </div>

      {/* Bottom navigation */}
      <div style={{position:'fixed', bottom:0, left:0, right:0,
        background:'#0a0f1a', borderTop:'1px solid #1e293b', display:'flex', zIndex:200}}>
        {tabs.map(t => (
          <button key={t.k} onClick={() => setTab(t.k)}
            style={{flex:1, padding:'10px 4px 14px', background:'none', border:'none',
              borderTop: tab === t.k ? '2px solid #3b82f6' : '2px solid transparent',
              color: tab === t.k ? '#93c5fd' : '#475569',
              fontSize:11, cursor:'pointer', fontFamily:'Georgia,serif',
              fontWeight: tab === t.k ? 700 : 400, lineHeight:1.5}}>
            <div style={{fontSize:18}}>{t.icon}</div>
            {t.label}
          </button>
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
